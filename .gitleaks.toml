[extend]
useDefault = true

# The current tree takes no exception (PLAN-002 decision D3): a secret-shaped value is changed in the
# code, never allowlisted. Reviewed history findings are exact fingerprints in .gitleaksignore.

[[allowlists]]
description = "Generated outputs and pinned third-party frontend assets"
paths = [
  '''(^|/)(bin|obj|node_modules)/''',
  '''(^|/)\.analysis-[^/]+/''',
  '''(^|/)\.pipeline-artifacts/''',
  '''(^|/)\.qa-test-results/''',
  '''(^|/)coverage[^/]*/''',
  '''(^|/)src/Aetheus\.Front/wwwroot/lib/''',
  # The same vendored assets before the move to src/ and the Prometheus to Aetheus rename (history
  # scans only: the path no longer exists in the tree). Recette R2-055, finding #793.
  '''(^|/)Prometheus\.Front/wwwroot/lib/'''
]
