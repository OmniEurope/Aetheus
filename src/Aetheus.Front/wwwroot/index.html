<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetheus</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- PLAN-008 (ADR-046): the OmniEurope.Blazor stylesheet, applied as shipped, before app.css so the
         application's explicit overrides keep the last word (one theme, recette R-054). -->
    <link rel="stylesheet" href="_content/OmniEurope.Blazor/omnieurope.blazor.css" />
    <link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
    <link rel="icon" type="image/svg+xml" href="aetheus-icon.svg" />
    <script type="importmap"></script>
    <script>
        (function() {
            var t = localStorage.getItem('aetheus_theme');
            // PLAN-008 (D17, lot 11), STD-SHELL: OmniThemeScope paints the application once Blazor runs, but
            // the boot splash is painted before that and lives outside the scope. So the stored mode is laid
            // on the document root here, dark by default, through the same data-omni-theme attribute the
            // scope uses; SiteAppearanceState keeps it in step afterwards (Aetheus.setOmniTheme). 'system'
            // reads the OS preference here too, so the first paint is already the right one.
            var light = t === 'light'
                || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
            document.documentElement.setAttribute('data-omni-theme', light ? 'light' : 'dark');
            // Align <html lang> with the effective boot culture: the saved preference if any,
            // otherwise the browser's own language (which is what Blazor.start falls back to).
            // Without this, a French-browser user with no saved preference kept lang="en",
            // mislabelling the document for screen readers and SEO.
            var lang = localStorage.getItem('aetheus_lang') || navigator.language || 'en';
            if (lang) document.documentElement.lang = lang.substring(0, 2);
            // Recette R-390: the text size and control size levels (1-10, 5 as drawn, no attribute). OE leaves
            // them to the host, on the document root, where its stylesheet reads them (layout.js on change).
            [['aetheus_text_size', 'data-oe-text-size'], ['aetheus_control_size', 'data-oe-control-size']].forEach(function (scale) {
                var level = parseInt(localStorage.getItem(scale[0]), 10);
                if (level >= 1 && level <= 10 && level !== 5) document.documentElement.setAttribute(scale[1], String(level));
            });
            // STD-SHELL: the tokens OmniThemeScope painted last time (theme, palette, font), copied by
            // layout.js (Aetheus.followThemeScope) under the half they were painted for. Laid on the root
            // only for the boot splash, so it shows in the chosen colours instead of flashing the shipped
            // ones; Aetheus.releaseBootTheme removes them once the splash is gone and the scope paints the
            // application. A copy of the other half (the mode changed since) is ignored.
            window.Aetheus = window.Aetheus || {};
            window.Aetheus._bootTokenNames = [];
            try {
                var tokens = JSON.parse(localStorage.getItem('aetheus_theme_tokens') || 'null');
                var half = tokens && (light ? tokens.light : tokens.dark);
                if (half) Object.keys(half).forEach(function (name) {
                    document.documentElement.style.setProperty(name, half[name]);
                    window.Aetheus._bootTokenNames.push(name);
                });
            } catch (e) { /* a malformed entry leaves the shipped look */ }
        })();
    </script>
</head>

<body>
    <div id="app"></div>

    <!-- Boot splash lives OUTSIDE #app so Blazor's first render into #app never replaces it:
         the same DOM node animates continuously from first paint until JS fades it out
         (Aetheus.hideSplash) once the app is ready - no node-swap animation flash.
         The plane svg is INLINED (not an <img>) so its internal loops can be held paused on the
         neutral start frame during the WASM boot (which stalls the main thread and would otherwise
         stutter the animation); JS removes `is-paused` once the runtime is up, and the loop begins
         exactly where the static frame sat - no size/position/tilt jump. -->
    <div id="app-splash" class="app-splash is-paused">
        <svg class="app-splash-logo" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <g class="p-ship">
                <g class="p-drift">
                    <g transform="translate(80,80) scale(0.92) translate(-80,-80)">
                        <g transform="translate(102,58) rotate(45)">
                            <g class="p-roll">
                                <path d="M0,-69 L62,69 L0,22 L-62,69 Z" fill="#1D4ED8"/>
                                <path d="M0,-44 L0,14" stroke="#93C5FD" stroke-width="5" stroke-linecap="round" fill="none"/>
                                <g stroke="#60A5FA" stroke-width="5" stroke-linecap="round" fill="none">
                                    <line class="p-jet" x1="0" y1="36" x2="0" y2="100"/>
                                    <line class="p-jet p-jet-left" x1="-31" y1="48" x2="-44" y2="88"/>
                                    <line class="p-jet p-jet-right" x1="31" y1="48" x2="44" y2="88"/>
                                </g>
                            </g>
                        </g>
                    </g>
                </g>
            </g>
        </svg>
    </div>

    <div id="app-start-error" class="app-start-error" role="alert" hidden>
        <div class="app-start-error__content">
            <p id="app-start-error-message"></p>
            <button id="app-start-retry" type="button"></button>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Cache-bust the hand-written scripts: they are NOT fingerprinted like the WASM assets, so a
         changed layout.js would otherwise stay stale in the browser (a new function like
         Aetheus.scrollToBottom would be "undefined" and its buttons silently no-op). Bump ?v= on any
         edit to these files. -->
    <script src="js/layout.js?v=16"></script>
    <script src="js/offline-registration.js?v=1"></script>
    <script src="js/docker-interop.js?v=3"></script>
    <script src="js/monaco-frame-host.js?v=1"></script>
    <script src="lib/dagre/dagre.min.js"></script>
    <script src="js/visual-pipeline.js?v=3"></script>
    <script type="module" src="js/aetheus-analytics-bootstrap.js?v=3"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Boot the runtime with the saved UI culture so its satellite resource assembly
        // (e.g. fr-FR/Aetheus.Front.resources) is downloaded AT BOOT. Setting the culture
        // later from Program.cs is too late: the framework has already loaded resources for the
        // browser-default culture, so a saved language that differs from the browser locale would
        // silently fall back to the base (English) strings. Omit the option when nothing is saved
        // so the browser's own language is used.
        (function () {
            var lang = localStorage.getItem('aetheus_lang');
            // Only forward a well-formed culture name (e.g. "en", "fr-FR"). A malformed or legacy
            // localStorage value must never reach Blazor.start, or it could fail the whole boot
            // (white screen). An unknown-but-well-formed culture is handled gracefully by .NET.
            var valid = lang && /^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$/.test(lang);
            // Nothing saved: boot in one of the two languages the app ships, as Settings already reads
            // it (any "fr*" is French). The bare browser culture "fr" found no Aetheus resources (only
            // fr-FR exists) and showed English, while OmniEurope, French by default, showed French:
            // one screen in two languages ("Autres actions" beside "More actions").
            var browser = navigator.language || 'en';
            var culture = valid ? lang : (/^fr/i.test(browser) ? 'fr-FR' : 'en');
            function showStartError() {
                var splash = document.getElementById('app-splash');
                var panel = document.getElementById('app-start-error');
                if (!splash || !panel || !panel.hidden) return;
                splash.remove();
                var french = /^fr/i.test(culture);
                document.getElementById('app-start-error-message').textContent = french
                    ? 'L’application n’a pas pu démarrer. Certains fichiers nécessaires sont indisponibles.'
                    : 'The application could not start. Some required files are unavailable.';
                var retry = document.getElementById('app-start-retry');
                retry.textContent = french ? 'Réessayer' : 'Retry';
                retry.addEventListener('click', function () { window.location.reload(); });
                panel.hidden = false;
            }
            window.addEventListener('error', function (event) {
                if (/\/_framework\//.test(event.filename || '')) showStartError();
            });
            window.addEventListener('unhandledrejection', function (event) {
                if (/\/_framework\//.test(String(event.reason))) showStartError();
            });
            if (typeof Blazor === 'undefined') {
                showStartError();
                return;
            }
            try {
                Blazor.start({ applicationCulture: culture }).then(function () {
                    // Un-pause the plane only after the runtime has left the main thread free.
                    var splash = document.getElementById('app-splash');
                    if (splash) splash.classList.remove('is-paused');
                }).catch(showStartError);
            } catch (error) {
                showStartError();
            }
        })();
    </script>
</body>

</html>
