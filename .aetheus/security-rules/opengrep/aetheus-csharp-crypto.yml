# SPDX-License-Identifier: EUPL-1.2
#
# C# cryptography and transport rules: broken hashes and ciphers, ECB, predictable random numbers,
# short keys, hard-coded keys, weak key derivation and switched-off certificate validation.
# Tests: tests/security-rules/aetheus-csharp-crypto.cs.
#
# Written from public vulnerability knowledge (CWE, NIST SP 800-131A and 800-132, the OWASP
# Cryptographic Storage and Password Storage cheat sheets, the .NET cryptography documentation), not
# from any third-party rule set.
#
# Two things are left to the author on purpose. A rule cannot tell a checksum that a file format
# dictates (a Maven .md5 file) from a password hash, and the algorithm is the thing it can see. The
# finding is the prompt to look; an accepted use carries a nosemgrep comment that says why.
rules:
  - id: aetheus.csharp.weak-hash-md5
    languages: [csharp]
    severity: WARNING
    message: >-
      MD5 is broken for collisions and far too fast for passwords. Use SHA-256 or stronger for
      integrity and signatures, and a password hashing function (PBKDF2, bcrypt, Argon2) for secrets.
    metadata:
      cwe: CWE-328
      owasp: A02:2021 Cryptographic Failures
      category: security
    pattern-either:
      - pattern: MD5.Create(...)
      - pattern: MD5.HashData(...)
      - pattern: MD5.HashDataAsync(...)
      - pattern: new MD5CryptoServiceProvider(...)
      - pattern: HashAlgorithm.Create("MD5")
      - pattern: IncrementalHash.CreateHash(HashAlgorithmName.MD5)
      - pattern: CryptoConfig.CreateFromName("MD5")

  - id: aetheus.csharp.weak-hash-sha1
    languages: [csharp]
    severity: WARNING
    message: >-
      SHA-1 collisions are practical. Do not use it for signatures, certificates, integrity checks
      or password storage. Use SHA-256 or stronger.
    metadata:
      cwe: CWE-328
      owasp: A02:2021 Cryptographic Failures
      category: security
    pattern-either:
      - pattern: SHA1.Create(...)
      - pattern: SHA1.HashData(...)
      - pattern: SHA1.HashDataAsync(...)
      - pattern: new SHA1CryptoServiceProvider(...)
      - pattern: new SHA1Managed(...)
      - pattern: HashAlgorithm.Create("SHA1")
      - pattern: IncrementalHash.CreateHash(HashAlgorithmName.SHA1)
      - pattern: CryptoConfig.CreateFromName("SHA1")

  - id: aetheus.csharp.weak-cipher
    languages: [csharp]
    severity: ERROR
    message: >-
      DES, Triple DES and RC2 have key or block sizes that no longer resist an attack. Use AES-GCM
      (AesGcm) or AES-CBC with an HMAC.
    metadata:
      cwe: CWE-327
      owasp: A02:2021 Cryptographic Failures
      category: security
    pattern-either:
      - pattern: DES.Create(...)
      - pattern: TripleDES.Create(...)
      - pattern: RC2.Create(...)
      - pattern: new DESCryptoServiceProvider(...)
      - pattern: new TripleDESCryptoServiceProvider(...)
      - pattern: new RC2CryptoServiceProvider(...)
      - pattern: SymmetricAlgorithm.Create("DES")
      - pattern: SymmetricAlgorithm.Create("3DES")
      - pattern: SymmetricAlgorithm.Create("TripleDES")
      - pattern: SymmetricAlgorithm.Create("RC2")

  - id: aetheus.csharp.ecb-mode
    languages: [csharp]
    severity: ERROR
    message: >-
      ECB encrypts identical blocks to identical ciphertext and so reveals the structure of the data.
      Use an authenticated mode (AesGcm) or CBC with a random IV and a MAC.
    metadata:
      cwe: CWE-327
      owasp: A02:2021 Cryptographic Failures
      category: security
    pattern-either:
      - pattern: CipherMode.ECB
      - pattern: $C.EncryptEcb(...)
      - pattern: $C.DecryptEcb(...)

  - id: aetheus.csharp.random-for-secret
    languages: [csharp]
    severity: ERROR
    message: >-
      System.Random is predictable: from a few outputs the rest can be computed. A token, key, salt,
      nonce, password or one-time code must come from RandomNumberGenerator.
    metadata:
      cwe: CWE-338
      owasp: A02:2021 Cryptographic Failures
      category: security
    patterns:
      - pattern-either:
          - pattern: new Random(...)
          - pattern: new System.Random(...)
          - pattern: Random.Shared
          - pattern: System.Random.Shared
      - pattern-inside: |
          $RET $FUNC(...) { ... }
      - metavariable-regex:
          metavariable: $FUNC
          regex: (?i)^.*(token|secret|password|passwd|apikey|api_?key|salt|nonce|otp|csrf|session|credential|invitation|verification|activation|recovery|passcode)

  - id: aetheus.csharp.rsa-short-key
    languages: [csharp]
    severity: ERROR
    message: >-
      An RSA, DSA or Diffie-Hellman key under 2048 bits can be factored or broken with the means of a
      well-funded attacker. Use 2048 bits at least, 3072 for long-lived keys.
    metadata:
      cwe: CWE-326
      owasp: A02:2021 Cryptographic Failures
      category: security
    patterns:
      - pattern-either:
          - pattern: new RSACryptoServiceProvider($BITS, ...)
          - pattern: new DSACryptoServiceProvider($BITS, ...)
          - pattern: RSA.Create($BITS)
          - pattern: DSA.Create($BITS)
          - pattern: $KEY.KeySize = $BITS;
      - metavariable-regex:
          metavariable: $BITS
          regex: ^(?:512|768|1024)$

  - id: aetheus.csharp.hard-coded-crypto-key
    languages: [csharp]
    severity: ERROR
    message: >-
      A key or an initialisation vector written in the source is known to everyone who can read the
      source or the binary. Load the key from a secret store and generate the IV randomly for each
      message.
    metadata:
      cwe: CWE-321
      owasp: A02:2021 Cryptographic Failures
      category: security
    pattern-either:
      - pattern: $A.Key = $ENC.GetBytes("...");
      - pattern: $A.IV = $ENC.GetBytes("...");
      - pattern: $A.Key = new byte[] { ... };
      - pattern: $A.IV = new byte[] { ... };
      - pattern: $A.IV = new byte[$N];
      - pattern: new SymmetricSecurityKey($ENC.GetBytes("..."))
      - pattern: new HMACSHA256($ENC.GetBytes("..."))
      - pattern: new HMACSHA512($ENC.GetBytes("..."))

  - id: aetheus.csharp.weak-key-derivation
    languages: [csharp]
    severity: WARNING
    message: >-
      The password-based key derivation is too cheap: either it uses the SHA-1 default of the
      three-argument Rfc2898DeriveBytes constructor, or it asks for fewer than 100000 iterations.
      Use SHA-256 or SHA-512 with at least 600000 iterations (OWASP), or Argon2.
    metadata:
      cwe: CWE-916
      owasp: A02:2021 Cryptographic Failures
      category: security
    patterns:
      - pattern-either:
          - pattern: new Rfc2898DeriveBytes($PASSWORD, $SALT, $ITERATIONS)
          - patterns:
              - pattern-either:
                  - pattern: new Rfc2898DeriveBytes($PASSWORD, $SALT, $ITERATIONS, $ALGORITHM)
                  - pattern: Rfc2898DeriveBytes.Pbkdf2($PASSWORD, $SALT, $ITERATIONS, $ALGORITHM, $LENGTH)
              - metavariable-regex:
                  metavariable: $ITERATIONS
                  regex: ^(?:[0-9]{1,5}|[0-9]{1,2}_[0-9]{3})$

  - id: aetheus.csharp.deprecated-tls-protocol
    languages: [csharp]
    severity: ERROR
    message: >-
      SSL 2.0, SSL 3.0, TLS 1.0 and TLS 1.1 are broken or deprecated (RFC 8996). Ask for TLS 1.2 and
      TLS 1.3, or leave the choice to the operating system (SslProtocols.None).
    metadata:
      cwe: CWE-327
      owasp: A02:2021 Cryptographic Failures
      category: security
    pattern-either:
      - pattern: SslProtocols.Ssl2
      - pattern: SslProtocols.Ssl3
      - pattern: SslProtocols.Tls
      - pattern: SslProtocols.Tls11
      - pattern: SecurityProtocolType.Ssl3
      - pattern: SecurityProtocolType.Tls
      - pattern: SecurityProtocolType.Tls11

  - id: aetheus.csharp.certificate-validation-always-true
    languages: [csharp]
    severity: ERROR
    message: >-
      A certificate validation callback that returns true accepts every certificate, which turns TLS
      into encryption without authentication. Validate the chain, or pin the expected certificate.
    metadata:
      cwe: CWE-295
      owasp: A07:2021 Identification and Authentication Failures
      category: security
    pattern-either:
      - pattern: ServicePointManager.ServerCertificateValidationCallback = (...) => true;
      - pattern: ServicePointManager.ServerCertificateValidationCallback += (...) => true;
      - pattern: ServicePointManager.ServerCertificateValidationCallback = delegate { return true; };
      - pattern: ServicePointManager.ServerCertificateValidationCallback += delegate { return true; };
      - pattern: new SslStream($INNER, $LEAVEOPEN, (...) => true)
      - pattern: new SslStream($INNER, $LEAVEOPEN, delegate { return true; })
      - pattern: $H.ServerCertificateCustomValidationCallback = delegate { return true; };
      - pattern: $H.RemoteCertificateValidationCallback = delegate { return true; };
      # The same lambdas as a member initializer have no receiver, which the receiver-qualified
      # assignment rule of aetheus-delivery.yml does not see.
      - pattern-regex: (?<![.\w])(?:RemoteCertificateValidationCallback|ServerCertificateCustomValidationCallback)\s*=\s*(?:\([^()]*\)|[A-Za-z_]\w*)\s*=>\s*true\b
