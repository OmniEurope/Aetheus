# =============================================================================
# vpssim.compose.yml - Aetheus disposable local "VPS simulator"
# =============================================================================
# Boots a replaceable Ubuntu box (systemd PID 1 + Docker daemon + sshd) so the
# agent's collectors and the real install script can be tested locally instead
# of on the production VPS. Container replacement preserves the nested Docker
# stores and the agent state, matching a VPS reboot without regenerating secrets.
#
# STAGE 1: de-risk systemd + dockerd + sshd boot under Docker Desktop (cgroup v2).
# Requires `privileged` for both systemd cgroup management and the nested Docker
# daemon (DinD). LOCAL TEST ONLY - never deployed.
#
#   docker compose -f deploy/compose/vpssim.compose.yml up -d --build
#   docker exec -it aetheus-vpssim systemctl status
#   docker compose -f deploy/compose/vpssim.compose.yml down
# =============================================================================
services:

  vpssim:
    container_name: ${APPNAME:-aetheus}-vpssim
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.vpssim
      args:
        # -net10: pre-bake the .NET SDK 10.0 into the image (1) or keep it absent (0, default).
        INSTALL_DOTNET: ${VPSSIM_DOTNET:-0}
    # systemd needs to manage cgroups; DinD needs device access.
    privileged: true
    # The image defaults to an unprivileged user. This local system-container
    # harness opts into uid 0 explicitly because systemd and DinD require it.
    user: "0:0"
    cgroup: host
    # Reach the host-side backend (started by ylaunch) for agent enrollment.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "aetheus.localhost:127.0.0.1"
      - "app.aetheus.localhost:127.0.0.1"
      - "api.aetheus.localhost:127.0.0.1"
      # The cutover publishes two static properties, the vitrine and the documentation site, each on
      # its own name. Without this one the mirror could publish the docs payload and still serve the
      # stock Apache page, which is what happened on deploy-local run 1173.
      - "docs.aetheus.localhost:127.0.0.1"
      # The nightly demo deploys here and then probes BG_PUBLIC_ORIGIN. That name is a real public
      # record pointing at the production VPS, so without this the simulated box deployed its own
      # demo and graded the production one, whose credentials differ - a 401 in OneTimeSetUp that
      # reads like a broken deployment. On the real host the name already resolves to itself; this
      # gives the simulation the same property. Browser smoke containers run with --network host,
      # so they inherit this file.
      - "demo.app.aetheus.sonytumen.com:127.0.0.1"
    # Optional agent auto-install. VPSSIM_AGENT=1 → the box mints a token from the
    # backend API at boot and self-installs the agent (appears in the dashboard).
    # Default 0 → blank VPS, no agent. Auto-install requires either AGENT_TOKEN
    # or an explicitly supplied VPSSIM_ADMIN_PASSWORD; no password is embedded here.
    environment:
      - AGENT_AUTOINSTALL=${VPSSIM_AGENT:-0}
      - BACKEND_URL=${VPSSIM_BACKEND_URL:-https://host.docker.internal:5301}
      - ADMIN_EMAIL=${VPSSIM_ADMIN_EMAIL:-admin@aetheus.local}
      - ADMIN_PASSWORD=${VPSSIM_ADMIN_PASSWORD:-}
      - AGENT_TOKEN=${VPSSIM_AGENT_TOKEN:-}
      - AGENT_NAME=${VPSSIM_AGENT_NAME:-vpssim}
    # systemd expects writable tmpfs for runtime state.
    tmpfs:
      - /run
      - /run/lock
    volumes:
      # systemd cgroup hierarchy.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Dedicated volumes for the nested daemon's stores. These sit on the Docker
      # Desktop VM's ext4 (not the container's overlay rootfs), so the nested
      # overlayfs snapshotter can mount - fixes "overlay ... invalid argument".
      # Docker 29 routes image layers through containerd, hence both paths.
      - vpssim-docker:/var/lib/docker
      - vpssim-containerd:/var/lib/containerd
      # The deployment state and generated secrets must survive replacement of the outer
      # simulator container just as they survive a real VPS reboot. Without this volume,
      # PostgreSQL keeps its old password in the nested Docker volume while the agent creates
      # a new .env file, making the next migration fail with 28P01.
      - vpssim-agent-state:/var/lib/aetheus-agent
      # Secret-zero and its installation-dated backups deliberately live outside the agent purge boundary.
      - vpssim-production-state:/var/lib/aetheus-production
      # The nightly demo keeps its own secrets and Compose environment here, and the demo database
      # volume below remembers the password they contain. Without this volume a simulator rebuild
      # erased the secrets while the database kept the old ones: nightly run 1218 could not even
      # roll back ("State directory /var/lib/aetheus-demo does not exist"), and the next preparation
      # would have regenerated a password the database refuses (28P01), exactly what the production
      # line above exists to prevent.
      - vpssim-demo-state:/var/lib/aetheus-demo
      # A real VPS keeps its host-level proxy, certificates and static site across reboots. Preserve
      # the same state when Docker Compose replaces the outer simulator after an image rebuild.
      - vpssim-apache:/etc/apache2
      - vpssim-letsencrypt:/etc/letsencrypt
      - vpssim-www:/var/www
    ports:
      # Bind to loopback only: the box has root:password SSH (Dockerfile.vpssim), so publishing it
      # on 0.0.0.0 would expose a root-password SSH endpoint to the LAN. Local test access only.
      - "127.0.0.1:${VPSSIM_SSH_PORT:-2222}:22"
      - "127.0.0.1:${VPSSIM_HTTP_PORT:-10080}:80"
      - "127.0.0.1:${VPSSIM_HTTPS_PORT:-10443}:443"
    # systemd's graceful-shutdown signal.
    stop_signal: SIGRTMIN+3
    stop_grace_period: 10s

volumes:
  vpssim-docker:
  vpssim-containerd:
  vpssim-agent-state:
  vpssim-production-state:
  vpssim-demo-state:
  vpssim-apache:
  vpssim-letsencrypt:
  vpssim-www:
