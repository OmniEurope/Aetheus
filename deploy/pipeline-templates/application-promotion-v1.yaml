name: application-promotion-template
trigger: manual
parameters:
  - name: candidateVersion
    display_name: Candidate release version
    type: string
    required: true
variables:
  APPLICATION_DEPLOY_PIPELINE: application-deploy
  APPLICATION_VERIFY_PIPELINE: application-verify
  CANDIDATE_VERSION: "${{ parameters.candidateVersion }}"

stages:
  - name: Deploy
    group: Deploy
    execution_role: deploy
    os: linux
    steps:
      - name: Deploy exact candidate bytes
        type: trigger
        pipeline: "$(APPLICATION_DEPLOY_PIPELINE)"
        variables:
          APPLICATION_CANDIDATE_VERSION: "$(CANDIDATE_VERSION)"
        timeout_seconds: 5400

  - name: Verify
    group: Smoke
    execution_role: deploy
    os: linux
    depends_on: [Deploy]
    steps:
      - name: Verify promoted application
        type: trigger
        pipeline: "$(APPLICATION_VERIFY_PIPELINE)"
        timeout_seconds: 1800

  - name: MarkDeployed
    group: Release
    execution_role: build
    os: linux
    depends_on: [Verify]
    steps:
      - name: Mark the same candidate release as deployed
        type: release
        version: "$(CANDIDATE_VERSION)"
        deployed: true
        timeout_seconds: 300
