# SPDX-License-Identifier: EUPL-1.2
# v2 (recette R2-121), for projects onboarded through the setup wizard. Against v1:
# - the released artifact defaults to ApplicationPayload-artifacts, the payload application-ci packages
#   (v1 named Package-artifacts, which no generic pipeline produces);
# - the baseline restore exports the deployed baseline's identity itself, so v1's separate export step,
#   which ran beside the restore (the steps of a stage run concurrently, ADR-012) and needed Node on the
#   runner, is gone; the DELIVERY_BASELINE_* defaults below describe a first release;
# - Quality, Security and QA run only for the pipelines the project has (APPLICATION_*_ENABLED, written
#   by the wizard); a stage skipped that way counts as done for the next one.
# v1 is unchanged and stays what aetheus-candidate pins.
name: application-candidate-template
trigger: manual
parameters:
  - name: performance
    display_name: Run the optional performance smoke
    type: boolean
    default: "false"
variables:
  APPLICATION_CI_PIPELINE: application-ci
  APPLICATION_QUALITY_PIPELINE: application-quality
  APPLICATION_SECURITY_PIPELINE: application-security
  APPLICATION_QA_PIPELINE: application-qa
  APPLICATION_ARTIFACT_NAME: ApplicationPayload-artifacts
  APPLICATION_QUALITY_ENABLED: "true"
  APPLICATION_SECURITY_ENABLED: "true"
  APPLICATION_QA_ENABLED: "true"
  CANDIDATE_VERSION: "c-$(BUILD_SOURCEVERSION)"
  DELIVERY_BASELINE_BOOTSTRAP: "true"
  DELIVERY_BASELINE_CANDIDATE_VERSION: ""
  DELIVERY_BASELINE_SOURCE_SHA: ""
  DELIVERY_BASELINE_CONTRACT_SHA256: ""

stages:
  - name: Baseline
    group: Source
    execution_role: build
    os: linux
    steps:
      - name: Restore factually deployed baseline contract
        type: restore-artifacts
        release: previous-deployed
        artifact: "$(APPLICATION_ARTIFACT_NAME)"
        target_directory: .delivery-baseline
        allow_missing: true
        timeout_seconds: 1200

  - name: CI
    group: Build
    execution_role: build
    os: linux
    depends_on: [Baseline]
    steps:
      - name: Build, test and package exact source
        type: trigger
        pipeline: "$(APPLICATION_CI_PIPELINE)"
        variables:
          DELIVERY_BASELINE_BOOTSTRAP: "$(DELIVERY_BASELINE_BOOTSTRAP)"
          DELIVERY_BASELINE_CANDIDATE_VERSION: "$(DELIVERY_BASELINE_CANDIDATE_VERSION)"
          DELIVERY_BASELINE_SOURCE_SHA: "$(DELIVERY_BASELINE_SOURCE_SHA)"
          DELIVERY_BASELINE_CONTRACT_SHA256: "$(DELIVERY_BASELINE_CONTRACT_SHA256)"
        timeout_seconds: 7200

  - name: Quality
    group: Quality
    execution_role: build
    os: linux
    depends_on: [CI]
    condition: "eq(variables['APPLICATION_QUALITY_ENABLED'], 'true')"
    steps:
      - name: Produce quality evidence and evaluate its gate
        type: trigger
        pipeline: "$(APPLICATION_QUALITY_PIPELINE)"
        timeout_seconds: 7200

  - name: Security
    group: Security
    execution_role: build
    os: linux
    depends_on: [CI]
    condition: "eq(variables['APPLICATION_SECURITY_ENABLED'], 'true')"
    steps:
      - name: Produce security evidence and evaluate its gate
        type: trigger
        pipeline: "$(APPLICATION_SECURITY_PIPELINE)"
        timeout_seconds: 7200

  - name: QA
    group: QA
    execution_role: build
    os: linux
    depends_on: [Quality, Security]
    condition: "eq(variables['APPLICATION_QA_ENABLED'], 'true')"
    steps:
      - name: Validate V, dynamic security, rollback V-1 and teardown
        type: trigger
        pipeline: "$(APPLICATION_QA_PIPELINE)"
        variables:
          APPLICATION_PERFORMANCE_ENABLED: "${{ parameters.performance }}"
        timeout_seconds: 18000

  - name: Candidate
    group: Release
    execution_role: build
    os: linux
    depends_on: [QA]
    steps:
      - name: Publish immutable undeployed candidate
        type: release
        version: "$(CANDIDATE_VERSION)"
        changelog: true
        deployed: false
        artifact: "$(APPLICATION_ARTIFACT_NAME)"
        artifact_source_pipeline: "$(APPLICATION_CI_PIPELINE)"
        timeout_seconds: 300
