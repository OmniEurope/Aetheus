# SPDX-License-Identifier: EUPL-1.2
# v4 (recette R-23, W8), for projects onboarded through the setup wizard. Against v3, one stage: Candidate verdict.
# The release v3 published carried no grade and no verdict although the Quality and Security gates had graded the
# candidate, so every deployment stopped on the approval of a release "not qualified". The gates now publish their
# grade (ANALYSIS_QUALITY_GRADE, ANALYSIS_SECURITY_GRADE, handed up by the trigger steps) and the function
# grade-candidate-from-gates turns them into CANDIDATE_ASSURANCE_GRADE (the worst grade) and CANDIDATE_DEPLOYABLE
# (whether it reaches AETHEUS_DEPLOY_MINIMUM_GRADE, else E), which the release step reads like the platform's own
# seal. A release graded F, refused or without a grade still asks for the approval of its deployment (R-24).
# The rest is v3 (recette R2-1). Against v2, its stages and their order are the platform's own candidate (ADR-054):
# - the deployed baseline is the one in service (current-deployed), restored before anything is built, and
#   a bootstrap, the first release of a project, is accepted unless the run says otherwise (parameter
#   allowBootstrap);
# - Security follows Quality instead of running beside it, and QA starts as soon as the CI has finished
#   (it needs only the payload); the candidate waits for the three;
# - the baseline identity is exported by the restore itself (DELIVERY_BASELINE_*), so no step of this
#   template needs Node or a project script.
# Quality, Security and QA run only for the pipelines the project has (APPLICATION_*_ENABLED, written by the
# wizard); a stage skipped that way counts as done for the next one. The wizard turns QA off when the project
# declares no QA command, because the QA pipeline refuses to run without one (recette R2-7 and R2-8).
# Still left out: the sealed assurance contract. It grades test gates the platform's own CI records in run
# variables, which a generic project does not publish; here a failing gate fails its stage, the verdict above
# comes from the analysis gates, and the candidate is published only when every stage that ran has passed.
# v1, v2 and v3 are unchanged: the pipelines pinned to them keep running as they did.
name: application-candidate-template
trigger: manual
parameters:
  - name: performance
    display_name: Run the optional performance smoke
    type: boolean
    default: "false"
  - name: allowBootstrap
    display_name: Accept this release as the first one when no deployed baseline exists
    type: boolean
    default: "true"
variables:
  APPLICATION_CI_PIPELINE: application-ci
  APPLICATION_QUALITY_PIPELINE: application-quality
  APPLICATION_SECURITY_PIPELINE: application-security
  APPLICATION_QA_PIPELINE: application-qa
  APPLICATION_ARTIFACT_NAME: ApplicationPayload-artifacts
  APPLICATION_QUALITY_ENABLED: "true"
  APPLICATION_SECURITY_ENABLED: "true"
  APPLICATION_QA_ENABLED: "true"
  CANDIDATE_VERSION: "c-$(BUILD_SOURCEVERSION)"
  DELIVERY_BASELINE_BOOTSTRAP: "true"
  DELIVERY_BASELINE_CANDIDATE_VERSION: ""
  DELIVERY_BASELINE_SOURCE_SHA: ""
  DELIVERY_BASELINE_CONTRACT_SHA256: ""

stages:
  - name: Baseline
    group: Source
    execution_role: build
    os: linux
    steps:
      - name: Restore factually deployed baseline contract
        type: restore-artifacts
        release: current-deployed
        artifact: "$(APPLICATION_ARTIFACT_NAME)"
        target_directory: .delivery-baseline
        allow_missing: true
        timeout_seconds: 1200

  - name: Check bootstrap allowed
    group: Source
    execution_role: build
    os: linux
    depends_on: [Baseline]
    steps:
      - name: Refuse unauthorized bootstrap before CI
        # bootstrap defaults to the DELIVERY_BASELINE_BOOTSTRAP the restore above published.
        type: aetheus
        function: authorize-baseline-bootstrap
        with:
          allow_bootstrap: "${{ parameters.allowBootstrap }}"
        timeout_seconds: 60

  - name: CI
    group: Build
    execution_role: build
    os: linux
    depends_on: [Check bootstrap allowed]
    steps:
      - name: Build, test and package exact source
        type: trigger
        pipeline: "$(APPLICATION_CI_PIPELINE)"
        variables:
          DELIVERY_BASELINE_BOOTSTRAP: "$(DELIVERY_BASELINE_BOOTSTRAP)"
          DELIVERY_BASELINE_CANDIDATE_VERSION: "$(DELIVERY_BASELINE_CANDIDATE_VERSION)"
          DELIVERY_BASELINE_SOURCE_SHA: "$(DELIVERY_BASELINE_SOURCE_SHA)"
          DELIVERY_BASELINE_CONTRACT_SHA256: "$(DELIVERY_BASELINE_CONTRACT_SHA256)"
        timeout_seconds: 7200

  - name: Quality
    group: Quality
    execution_role: build
    os: linux
    depends_on: [CI]
    condition: "eq(variables['APPLICATION_QUALITY_ENABLED'], 'true')"
    steps:
      - name: Produce quality evidence and evaluate its gate
        type: trigger
        pipeline: "$(APPLICATION_QUALITY_PIPELINE)"
        timeout_seconds: 7200

  # Serialize scanner-heavy Security after Quality to respect the runner's resource limits.
  - name: Security
    group: Security
    execution_role: build
    os: linux
    depends_on: [Quality]
    condition: "eq(variables['APPLICATION_SECURITY_ENABLED'], 'true')"
    steps:
      - name: Produce security evidence and evaluate its gate
        type: trigger
        pipeline: "$(APPLICATION_SECURITY_PIPELINE)"
        timeout_seconds: 7200

  # QA needs only the CI payload, so it starts as soon as the CI has succeeded; the candidate below still
  # joins every gate.
  - name: QA
    group: QA
    execution_role: build
    os: linux
    depends_on: [CI]
    condition: "eq(variables['APPLICATION_QA_ENABLED'], 'true')"
    steps:
      - name: Validate V, rollback V-1 and teardown
        type: trigger
        pipeline: "$(APPLICATION_QA_PIPELINE)"
        variables:
          APPLICATION_PERFORMANCE_ENABLED: "${{ parameters.performance }}"
        timeout_seconds: 18000

  # The grades of the gates that ran become the release's verdict; a stage skipped because the project has no such
  # pipeline is left out of it (its APPLICATION_*_ENABLED is false).
  - name: Candidate verdict
    group: Release
    execution_role: build
    os: linux
    depends_on: [QA, Quality, Security]
    steps:
      - name: Grade the candidate from its Quality and Security gates
        type: aetheus
        function: grade-candidate-from-gates
        timeout_seconds: 60

  - name: Candidate
    group: Release
    execution_role: build
    os: linux
    depends_on: [Candidate verdict]
    steps:
      - name: Publish immutable undeployed candidate
        type: release
        version: "$(CANDIDATE_VERSION)"
        changelog: true
        deployed: false
        artifact: "$(APPLICATION_ARTIFACT_NAME)"
        artifact_source_pipeline: "$(APPLICATION_CI_PIPELINE)"
        timeout_seconds: 300
