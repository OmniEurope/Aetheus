# SPDX-License-Identifier: EUPL-1.2
# Builds and qualifies the project's .NET web analytics package with its commands: shell written in its
# pipeline in APPLICATION_PACKAGE_DOTNET_ANALYTICS_COMMANDS (run with `sh -eu -c` from the workspace),
# leaving the package in .pipeline-artifacts/packages/. Nothing is required in its repository (ADR-050,
# recette R3-64); without commands the step fails and says so.
name: package-web-analytics-dotnet-template
trigger: manual
variables:
  APPLICATION_PACKAGE_DOTNET_ANALYTICS_COMMANDS: ""

stages:
  - name: Package
    group: Packages
    execution_role: build
    os: linux
    artifacts:
      - ".pipeline-artifacts/packages/**"
    steps:
      - name: Build and qualify .NET web analytics package
        working_directory: "$(WORKSPACE)"
        shell: |
          set -eu
          if test -z "${APPLICATION_PACKAGE_DOTNET_ANALYTICS_COMMANDS:-}"; then
            echo "No package command declared: set APPLICATION_PACKAGE_DOTNET_ANALYTICS_COMMANDS in this pipeline." >&2
            exit 1
          fi
          sh -eu -c "$APPLICATION_PACKAGE_DOTNET_ANALYTICS_COMMANDS"
          test -d .pipeline-artifacts/packages
          find .pipeline-artifacts/packages -type f -print -quit | grep -q .
        timeout_seconds: 3600
