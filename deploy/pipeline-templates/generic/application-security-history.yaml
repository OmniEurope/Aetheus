# SPDX-License-Identifier: EUPL-1.2
# Secret scan of the repository's Git history, the nightly extension of application-security.
#
# Scanning every reachable commit costs minutes and answers a question about the repository, not about
# the change a candidate packages: the current-tree scan of application-security catches the secret a
# commit adds. So only the nightly triggers this pipeline. Like the current-tree scan, it reads
# .gitleaks.toml at the repository root when there is one, and Gitleaks' built-in rules otherwise
# (recette R3-63): nothing is required in the repository.
name: application-security-history-template
trigger: manual
variables:
  # The checkout holds this many commits (the platform clones depth 1 otherwise): the history scan
  # covers what the checkout holds, so the depth is what makes it a history scan.
  AETHEUS_GIT_HISTORY_DEPTH: "100000"

stages:
  - name: Scan git history
    group: Security
    execution_role: build
    os: linux
    steps:
      - name: Produce Git-history secret evidence
        type: scanner
        scanner: gitleaks-history
        timeout_seconds: 1800

  # The generic grade counts open findings, never weighted (owner decision of 2026-10-17, ADR-030
  # amendment of that date): a project that wants the weighted score overrides this step in its own
  # pipeline. Every rule is required and the scale is the one of application-security (owner decision of
  # 2026-10-25, recette R-73 and R-74): no open finding is an A, the first one costs the A, then the grade
  # falls with the severity, never to an E: info, low and medium (B up to 5, C from 6, never worse), high
  # (a D from the first one, whatever the count), critical (F).
  - name: Grade security history
    group: Security
    execution_role: build
    os: linux
    depends_on: [Scan git history]
    steps:
      - name: Publish summaries and calculate the versioned security grade
        type: analysis-gate
        analysis_scope: security
        analysis_grading:
          version: 1
          minimum_grade: F
          required_domains:
            - security
          rules:
            - key: grade.security.critical
              domain: security
              severity: critical
              direction: lower-is-better
              a: 0
              b: 0
              c: 0
              d: 0
              e: 0
            - key: grade.security.high
              domain: security
              severity: high
              direction: lower-is-better
              a: 0
              b: 0
              c: 0
            - key: grade.security.medium
              domain: security
              severity: medium
              direction: lower-is-better
              a: 0
              b: 5
            - key: grade.security.low
              domain: security
              severity: low
              direction: lower-is-better
              a: 0
              b: 5
            - key: grade.security.info
              domain: security
              severity: info
              direction: lower-is-better
              a: 0
              b: 5
        timeout_seconds: 300
