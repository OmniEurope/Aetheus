# SPDX-License-Identifier: EUPL-1.2
# Builds and qualifies the project's telemetry package with its commands: shell written in its pipeline
# in APPLICATION_PACKAGE_TELEMETRY_COMMANDS (run with `sh -eu -c` from the workspace), leaving the package
# in .pipeline-artifacts/packages/. Nothing is required in its repository (ADR-050, recette R3-64); without
# commands the step fails and says so.
name: package-telemetry-template
trigger: manual
variables:
  APPLICATION_PACKAGE_TELEMETRY_COMMANDS: ""

stages:
  # The exact revision this run was launched on, as every pipeline of the platform starts (ADR-054).
  - name: Checkout
    group: Packages
    execution_role: build
    os: linux
    steps:
      - name: Check out the exact source
        checkout: true

  - name: Package
    group: Packages
    execution_role: build
    os: linux
    depends_on: [Checkout]
    artifacts:
      - ".pipeline-artifacts/packages/**"
    steps:
      - name: Build and qualify telemetry package
        working_directory: "$(WORKSPACE)"
        shell: |
          set -eu
          if test -z "${APPLICATION_PACKAGE_TELEMETRY_COMMANDS:-}"; then
            echo "No package command declared: set APPLICATION_PACKAGE_TELEMETRY_COMMANDS in this pipeline." >&2
            exit 1
          fi
          sh -eu -c "$APPLICATION_PACKAGE_TELEMETRY_COMMANDS"
          test -d .pipeline-artifacts/packages
          find .pipeline-artifacts/packages -type f -print -quit | grep -q .
        timeout_seconds: 3600
