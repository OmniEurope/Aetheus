# SPDX-License-Identifier: EUPL-1.2
# Static security evidence for a repository in any language, graded on one versioned scale.
#
# Every scanner is the platform's own, pinned in the scanner manifest: nothing is required in the
# repository. Gitleaks reads .gitleaks.toml at the root of the repository when it has one, and its
# built-in rules otherwise (recette R3-63). The four scans are independent, so they share a stage; the
# grade reads all four and sits in the stage after them (ADR-012: the steps of a stage run together).
# Image scanning needs images this template cannot know how to build: a project that ships containers
# adds its own stage in its pipeline.
# Its stages follow the platform's own security pipeline (ADR-054): checkout, proof that the checkout is
# the requested immutable revision, the CI manifest restored (which makes the restore refuse a payload
# built from another commit), the scans, the grade.
name: application-security-template
trigger: manual
variables:
  APPLICATION_CI_PIPELINE: application-ci

stages:
  - name: Checkout
    group: Security
    execution_role: build
    os: linux
    steps:
      - name: Check out the exact source
        checkout: true

  # After the checkout, in its own stage: the steps of one stage are concurrent.
  - name: Verify source
    group: Security
    execution_role: build
    os: linux
    depends_on: [Checkout]
    steps:
      - name: Verify immutable source
        type: aetheus
        function: verify-immutable-source
        timeout_seconds: 600

  - name: Restore CI manifest
    group: Security
    execution_role: build
    os: linux
    depends_on: [Verify source]
    steps:
      - name: Restore exact CI artifact manifest
        type: restore-artifacts
        artifact: ArtifactManifest-artifacts
        artifact_source_pipeline: "$(APPLICATION_CI_PIPELINE)"
        timeout_seconds: 300

  - name: Scan source
    group: Security
    execution_role: build
    os: linux
    depends_on: [Restore CI manifest]
    steps:
      - name: Scan secrets
        type: scanner
        scanner: gitleaks
        timeout_seconds: 600
      - name: Scan code (SAST)
        type: scanner
        scanner: opengrep
        retry_count: 1
        timeout_seconds: 1200
      - name: Scan dependencies
        type: scanner
        scanner: trivy-dependencies
        retry_count: 1
        timeout_seconds: 1200
      - name: Scan IaC
        type: scanner
        scanner: trivy-iac
        timeout_seconds: 900

  # The generic grade counts open findings, never weighted (owner decision of 2026-10-17, ADR-030
  # amendment of that date): a project that wants the weighted score overrides this step in its own
  # pipeline. Every rule is required, so the domain always has a grade (owner decision of 2026-10-25,
  # recette R-73 and R-74, ADR-030 amendment of that date): no open finding is an A, the first one costs
  # the A whatever its severity (one rule per severity, so the lines add up to the findings of the run), and
  # the grade falls with the severity, never to an E: info, low and medium (B up to 5, C from 6, never
  # worse), high (a D from the first one, whatever the count), critical (F). A rule that stops its
  # thresholds leaves the grade beyond the last one at the next grade.
  - name: Grade security
    group: Security
    execution_role: build
    os: linux
    depends_on: [Scan source]
    steps:
      - name: Publish summaries and calculate the versioned security grade
        type: analysis-gate
        analysis_scope: security
        analysis_grading:
          version: 1
          minimum_grade: F
          required_domains:
            - security
          rules:
            - key: grade.security.critical
              domain: security
              severity: critical
              direction: lower-is-better
              a: 0
              b: 0
              c: 0
              d: 0
              e: 0
            - key: grade.security.high
              domain: security
              severity: high
              direction: lower-is-better
              a: 0
              b: 0
              c: 0
            - key: grade.security.medium
              domain: security
              severity: medium
              direction: lower-is-better
              a: 0
              b: 5
            - key: grade.security.low
              domain: security
              severity: low
              direction: lower-is-better
              a: 0
              b: 5
            - key: grade.security.info
              domain: security
              severity: info
              direction: lower-is-better
              a: 0
              b: 5
        timeout_seconds: 300
