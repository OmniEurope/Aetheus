# SPDX-License-Identifier: EUPL-1.2
# Builds, tests and packages the project, then seals the payload's provenance. Nothing is required in
# the project's repository (ADR-050, recette R3-64): the project's own build is shell written in its
# pipeline, in APPLICATION_CI_COMMANDS (run with `sh -eu -c` from the workspace, it leaves the payload in
# .pipeline-artifacts/; a project that keeps its own build script calls it from there).
# A project that declares no build command delivers its source tree at this commit, as
# .pipeline-artifacts/source.tar.gz, and the step says so.
# One step on purpose: the steps of a stage run concurrently (ADR-012), and the provenance must describe
# the payload the build has finished writing. Every consumer (quality, QA, candidate) restores this
# artifact, and the restore refuses a payload without source-commit, delivery-contract.json and
# artifact-provenance.json, or built from another commit than its own run.
name: application-ci-template
trigger: manual
variables:
  APPLICATION_HAS_FRONTEND: "true"
  APPLICATION_HAS_BACKEND: "true"
  APPLICATION_HAS_DATABASE: "false"
  APPLICATION_CI_COMMANDS: ""

stages:
  - name: Application payload
    artifact_name: ApplicationPayload-artifacts
    group: Build
    execution_role: build
    os: linux
    artifacts:
      - ".pipeline-artifacts/**"
    steps:
      - name: Run project CI commands
        working_directory: "$(WORKSPACE)"
        shell: |
          set -eu
          mkdir -p .pipeline-artifacts
          if test -n "${APPLICATION_CI_COMMANDS:-}"; then
            APPLICATION_HAS_FRONTEND="$(APPLICATION_HAS_FRONTEND)" \
            APPLICATION_HAS_BACKEND="$(APPLICATION_HAS_BACKEND)" \
            APPLICATION_HAS_DATABASE="$(APPLICATION_HAS_DATABASE)" \
              sh -eu -c "$APPLICATION_CI_COMMANDS"
          else
            echo "No build command declared (APPLICATION_CI_COMMANDS is empty): the payload is the source tree at this commit."
            tar --exclude=./.git --exclude=./.pipeline-artifacts -czf .pipeline-artifacts/source.tar.gz .
          fi
          test -d .pipeline-artifacts
          find .pipeline-artifacts -type f -print -quit | grep -q .

          SOURCE_SHA="$(printf '%s' "$(BUILD_SOURCEVERSION)" | tr 'A-F' 'a-f')"
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "The run has no full source commit to seal the payload with." >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          # The project's build may seal its own payload; it is kept as written and only its commit is checked.
          if test -s .pipeline-artifacts/source-commit; then
            test "$(tr -d ' \r\n' < .pipeline-artifacts/source-commit)" = "$SOURCE_SHA"
          else
            printf '%s\n' "$SOURCE_SHA" > .pipeline-artifacts/source-commit
          fi
          if ! test -s .pipeline-artifacts/artifact-provenance.json; then
            find .pipeline-artifacts -type f \
              ! -path .pipeline-artifacts/source-commit \
              ! -path .pipeline-artifacts/delivery-contract.json \
              ! -path .pipeline-artifacts/artifact-provenance.json \
              | LC_ALL=C sort > .pipeline-payload-files
            if grep -q '["\\]' .pipeline-payload-files; then
              echo "A payload file name holds a quote or a backslash; rename it." >&2
              exit 1
            fi
            {
              printf '{"schemaVersion":1,"sourceCommit":"%s","files":[' "$SOURCE_SHA"
              SEPARATOR=""
              while IFS= read -r FILE; do
                SUM="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
                printf '%s{"path":"%s","sha256":"%s"}' "$SEPARATOR" "${FILE#.pipeline-artifacts/}" "$SUM"
                SEPARATOR=","
              done < .pipeline-payload-files
              printf ']}\n'
            } > .pipeline-artifacts/artifact-provenance.json
            rm -f .pipeline-payload-files
          fi
          if ! test -s .pipeline-artifacts/delivery-contract.json; then
            PROVENANCE_SUM="$(sha256sum .pipeline-artifacts/artifact-provenance.json | cut -d ' ' -f 1)"
            printf '{"schemaVersion":1,"adapter":"generic","candidateVersion":"c-%s","sourceSha":"%s","artifactProvenanceSha256":"%s"}\n' \
              "$SOURCE_SHA" "$SOURCE_SHA" "$PROVENANCE_SUM" > .pipeline-artifacts/delivery-contract.json
          fi
        timeout_seconds: 7200
