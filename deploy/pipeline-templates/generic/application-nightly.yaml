# SPDX-License-Identifier: EUPL-1.2
# Scheduled complete assurance, structured like the platform's own nightly: build cold, then quality,
# security, the Git-history secret scan, QA and the extended QA, one after the other. Each stage after
# the build runs only for a pipeline the project has (the setup wizard writes the *_ENABLED values); a
# stage skipped that way counts as done for the next one.
name: application-nightly-template
trigger: schedule
schedule: "0 0 2 * * *"
variables:
  APPLICATION_CI_PIPELINE: application-ci
  APPLICATION_QUALITY_PIPELINE: application-quality
  APPLICATION_SECURITY_PIPELINE: application-security
  APPLICATION_SECURITY_HISTORY_PIPELINE: application-security-history
  APPLICATION_QA_PIPELINE: application-qa
  APPLICATION_QA_EXTENDED_PIPELINE: application-qa-extended
  APPLICATION_QUALITY_ENABLED: "true"
  APPLICATION_SECURITY_ENABLED: "true"
  APPLICATION_SECURITY_HISTORY_ENABLED: "false"
  APPLICATION_QA_ENABLED: "true"
  APPLICATION_QA_EXTENDED_ENABLED: "false"

stages:
  - name: NightlyCI
    group: Build
    execution_role: build
    os: linux
    steps:
      - name: Build and test independently with cold caches
        type: trigger
        pipeline: "$(APPLICATION_CI_PIPELINE)"
        variables:
          CACHE_SCENARIO: cold
        timeout_seconds: 9000

  - name: NightlyQuality
    group: Quality
    execution_role: build
    os: linux
    depends_on: [NightlyCI]
    condition: "eq(variables['APPLICATION_QUALITY_ENABLED'], 'true')"
    steps:
      - name: Run complete quality analysis
        type: trigger
        pipeline: "$(APPLICATION_QUALITY_PIPELINE)"
        variables:
          FORMAT_MODE: full
        timeout_seconds: 9000

  - name: NightlySecurity
    group: Security
    execution_role: build
    os: linux
    depends_on: [NightlyQuality]
    condition: "eq(variables['APPLICATION_SECURITY_ENABLED'], 'true')"
    steps:
      - name: Run complete current-tree security analysis
        type: trigger
        pipeline: "$(APPLICATION_SECURITY_PIPELINE)"
        timeout_seconds: 9000

  - name: NightlySecurityHistory
    group: Security
    execution_role: build
    os: linux
    depends_on: [NightlySecurity]
    condition: "eq(variables['APPLICATION_SECURITY_HISTORY_ENABLED'], 'true')"
    steps:
      - name: Scan the whole Git history for secrets
        type: trigger
        pipeline: "$(APPLICATION_SECURITY_HISTORY_PIPELINE)"
        timeout_seconds: 9000

  - name: NightlyQA
    group: QA
    execution_role: build
    os: linux
    depends_on: [NightlySecurityHistory]
    condition: "eq(variables['APPLICATION_QA_ENABLED'], 'true')"
    steps:
      - name: Validate the nightly payload
        type: trigger
        pipeline: "$(APPLICATION_QA_PIPELINE)"
        timeout_seconds: 18000

  - name: NightlyQAExtended
    group: QA
    execution_role: build
    os: linux
    depends_on: [NightlyQA]
    condition: "eq(variables['APPLICATION_QA_EXTENDED_ENABLED'], 'true')"
    steps:
      - name: Run the extended QA
        type: trigger
        pipeline: "$(APPLICATION_QA_EXTENDED_PIPELINE)"
        timeout_seconds: 18000
