# SPDX-License-Identifier: EUPL-1.2
# Deploys an already-qualified candidate release of a monolith to production (R-11, ADR-057): one application serves the
# interface and the API, so the deployment has one host, one certificate and one virtual host. It is the setup wizard's
# choice for a project whose shape is the "Full-stack" tile; a project with a front and an API uses
# `application-deploy-prod-front-back`.
#
# Everything the deployment does is the common core's (`application-deploy-prod-core`, whose header describes the
# stages, the parameters and the variables). The strategy is limited to `replace`: a blue-green deployment is not
# supported for a monolith: the setup wizard writes nothing else for it, and a pipeline written by hand with another
# DEPLOY_STRATEGY is refused by the first stage of the run, before anything reaches the server.
name: application-deploy-prod-template
extends: application-deploy-prod-core@1
trigger: manual
stages:
  # A monolith is deployed by replacement only: a DEPLOY_STRATEGY other than `replace` (a hand-written `bluegreen`) is
  # refused here, before the candidate is restored, with the reason and the way out. The stage that restores the
  # candidate is written again to wait for this one (a stage a template writes replaces the core's field for field, so
  # its `agent` is the core's, copied; its step is the core's, kept).
  - name: Check the strategy
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    steps:
      - name: Refuse a strategy a monolith does not support
        shell: |
          case "${DEPLOY_STRATEGY:-}" in
            replace) ;;
            *)
              echo "DEPLOY_STRATEGY is '${DEPLOY_STRATEGY:-}': a monolith (one host for the interface and the API) is deployed by the 'replace' strategy only, a blue-green deployment needs the API's own host. Set DEPLOY_STRATEGY to replace, or extend application-deploy-prod-front-back for a front and an API." >&2
              exit 1 ;;
          esac
        timeout_seconds: 60

  - name: Restore candidate
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Check the strategy]
