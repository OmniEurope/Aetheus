# SPDX-License-Identifier: EUPL-1.2
# Deploys an already-qualified candidate release to production, turnkey (ADR-057, on the model of the platform's own
# production and demo pipelines, ADR-054). Nothing is required in the project's repository but its Compose file
# (ADR-050): the Apache virtual hosts and the environment sample are files of the project's configuration repository,
# which the setup wizard creates, and every value comes from the project's vault and libraries.
#
# The project's pipeline names its Compose file in COMPOSE_FILE, the path the setup wizard detected in the repository
# (left empty, the default deployment looks for compose.yaml, compose.yml, docker-compose.yaml or docker-compose.yml
# at the root). DEPLOY_STRATEGY picks how the release is brought up: `replace` (the default) replaces the running
# services of the Compose project; `bluegreen`, written by the wizard when the Compose file declares blue and green
# ports, starts the idle colour, moves the Apache upstream to it and keeps the previous colour in reserve.
# DEPLOY_HAS_API says the Compose file publishes a back port, so the API has its own host, certificate and virtual
# hosts beside the front's.
#
# The environment of the deployment: the step renders the versioned sample .pipeline/configs/env/production.env
# (`env_template`, one NAME=#{NAME}# line per variable, no value) from the vault and the libraries `<project>.prod`
# into a temporary file with the rights of its owner only, hands it to Docker Compose with --env-file and erases it
# when the deployment ends, whatever the outcome. No environment file path exists on the server any more.
#
# Its stages follow the platform's own production deployment: the candidate restored, the gate that proves it is the
# one that was qualified, the Apache HTTP virtual hosts (so the ACME challenge can be served), the certificates, the
# HTTPS virtual hosts, the deployment itself, the "deployed" mark. The steps of one stage run concurrently
# (ADR-012), so each of those is its own stage: in one stage the release could be marked deployed before the commands
# had run. The server is the `deployServer` parameter, the name of a server of the project (the setup wizard writes
# the server of the project's production environment, among the project's servers): every stage that works on the host runs on it.
#
# The default replacement is the shell in APPLICATION_DEPLOY_PROD_COMMANDS (run with `sh -eu -c` from the workspace),
# which a project replaces whole by setting that variable in its pipeline; a pipeline that sets it empty fails the
# step and says so, before the release is marked deployed. The commands receive the library entries of `share` and
# `prod` as environment variables, the path of the rendered environment file in DEPLOY_ENV_FILE, and the release as
# APP_VERSION and the commit as SOURCE_COMMIT.
name: application-deploy-prod-template
trigger: manual
parameters:
  - name: candidateVersion
    display_name: Candidate release version
    display_name_fr: Version de la release candidate
    type: string
    required: true
    description: The published candidate release to deploy.
    description_fr: La release candidate publiée à déployer.
  # The setup wizard writes this parameter again in the project's pipeline, as a choice among the project's
  # servers with the server of its production environment as default (recette R-21). Every stage that works on
  # the host runs on that server: none is guessed, a run without it is refused before it starts.
  - name: deployServer
    display_name: Production server
    display_name_fr: Serveur de production
    type: string
    required: true
    description: Name of the project's server the deployment runs on.
    description_fr: Nom du serveur du projet sur lequel le déploiement s'exécute.
variables:
  APPLICATION_CANDIDATE_VERSION: "${{ parameters.candidateVersion }}"
  # The name the backend reads for the release a run delivers (the `Advance main` stage, ADR-044).
  AETHEUS_CANDIDATE_VERSION: "${{ parameters.candidateVersion }}"
  APPLICATION_ROLLBACK_ENABLED: "true"
  # R-28: Verify candidate proves the deploy branch contains the release from the checkout's own history. Its
  # fallback fetch carries no credential, so on a private repository a depth-1 clone fails as soon as the branch
  # moved past the candidate commit: the history is cloned deep enough to hold it.
  AETHEUS_GIT_HISTORY_DEPTH: "1000"
  # Written by the setup wizard from the project's Compose file.
  COMPOSE_FILE: ""
  DEPLOY_STRATEGY: "replace"
  DEPLOY_HAS_API: "false"
  # The versioned environment sample the deployment renders (a file of the project's configuration repository).
  DEPLOY_ENV_SAMPLE: ".pipeline/configs/env/production.env"
  APPLICATION_DEPLOY_PROD_COMMANDS: |
    # Default deployment on a Docker server: the sealed source of the candidate is unpacked in DEPLOY_DIR (kept
    # between releases, so the project's volumes and files stay) and started with Docker Compose, with the
    # environment file the step rendered. A project that deploys otherwise sets APPLICATION_DEPLOY_PROD_COMMANDS.
    set -eu
    if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
      echo "Docker Compose is not available on this server: install it, or set APPLICATION_DEPLOY_PROD_COMMANDS in this pipeline." >&2
      exit 1
    fi
    PROJECT="${COMPOSE_PROJECT:-${APPLICATION_PREFIX:-}}"
    if test -z "$PROJECT"; then
      echo "No Compose project name: set COMPOSE_PROJECT in the prod library, or APPLICATION_PREFIX in this pipeline." >&2
      exit 1
    fi
    if ! test -s .pipeline-artifacts/source.tar.gz; then
      echo "The candidate payload holds no source archive (.pipeline-artifacts/source.tar.gz): set APPLICATION_DEPLOY_PROD_COMMANDS in this pipeline." >&2
      exit 1
    fi
    if ! test -s "${DEPLOY_ENV_FILE:-}"; then
      echo "The environment file was not rendered (DEPLOY_ENV_FILE is empty): the step that runs these commands renders it." >&2
      exit 1
    fi
    ARCHIVE="$PWD/.pipeline-artifacts/source.tar.gz"
    SOURCE_COMMIT="$(cat .pipeline-artifacts/source-commit 2>/dev/null || true)"
    APP_VERSION="${APPLICATION_CANDIDATE_VERSION:-}"
    # The values the platform itself gives the Compose file: the release, the commit and the public addresses.
    FRONT_URL="${PUBLIC_APP_URL:-}"
    API_BASE_URL="${PUBLIC_API_URL:-}"
    API_URL="${PUBLIC_API_URL:-}"
    export SOURCE_COMMIT APP_VERSION FRONT_URL API_BASE_URL API_URL
    DEPLOY_DIR="${DEPLOY_DIR:-${HOME:-/tmp}/.deployments/$PROJECT}"
    mkdir -p "$DEPLOY_DIR"
    # The images copy these files for the non-root user of their containers: the runner's restrictive umask
    # must not leave them unreadable.
    (umask 022 && tar -xzf "$ARCHIVE" -C "$DEPLOY_DIR")
    cd "$DEPLOY_DIR"
    if test -z "${DOTNET_SDK_VERSION:-}" && test -f global.json; then
      DOTNET_SDK_VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json | head -n 1)"
      export DOTNET_SDK_VERSION
    fi
    # Docker Compose reads COMPOSE_FILE itself: the project's own name is read once, then removed from the
    # environment so the -f below is the only file.
    COMPOSE_FILE_NAME="${COMPOSE_FILE:-}"
    unset COMPOSE_FILE
    if test -z "$COMPOSE_FILE_NAME"; then
      for CANDIDATE in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
        if test -f "$CANDIDATE"; then COMPOSE_FILE_NAME="$CANDIDATE"; break; fi
      done
    fi
    case "$COMPOSE_FILE_NAME" in
      "") echo "No Compose file: COMPOSE_FILE is empty and none of compose.yaml, compose.yml, docker-compose.yaml or docker-compose.yml is at the root of the sealed source. Set COMPOSE_FILE in this pipeline, or APPLICATION_DEPLOY_PROD_COMMANDS." >&2; exit 1 ;;
      /*|*..*) echo "COMPOSE_FILE must be a path inside the repository: $COMPOSE_FILE_NAME" >&2; exit 1 ;;
    esac
    if ! test -f "$COMPOSE_FILE_NAME"; then
      echo "The Compose file $COMPOSE_FILE_NAME is not in the sealed source of release ${APP_VERSION:-unknown}." >&2
      exit 1
    fi
    # The agent names the Buildx builder of a build step (BUILDX_BUILDER) without creating it when its Docker
    # maintenance is off: an absent or unhealthy builder is (re)created here, with the host's optional cap on
    # parallel build steps: BUILDX_MAX_PARALLELISM, a positive integer set per host (the agent's environment or a
    # library entry), for a small host where concurrent builds exhaust the memory. A healthy builder is left alone,
    # so changing the cap means removing the builder first (docker buildx rm <builder>).
    case "${BUILDX_MAX_PARALLELISM:-}" in
      '') ;;
      0*|*[!0-9]*) echo "BUILDX_MAX_PARALLELISM must be a positive integer: '$BUILDX_MAX_PARALLELISM'" >&2; exit 2 ;;
    esac
    if test -n "${BUILDX_BUILDER:-}" && ! docker buildx inspect "$BUILDX_BUILDER" --bootstrap >/dev/null 2>&1; then
      case "$BUILDX_BUILDER" in *[!a-zA-Z0-9._-]*) echo "Unsafe Buildx builder name: $BUILDX_BUILDER" >&2; exit 2 ;; esac
      BUILDKIT_CONFIG=""
      if test -n "${BUILDX_MAX_PARALLELISM:-}"; then
        mkdir -p "${HOME:-/tmp}/.buildx-config"
        BUILDKIT_CONFIG="${HOME:-/tmp}/.buildx-config/buildkitd-$BUILDX_BUILDER.toml"
        printf '[worker.oci]\n  max-parallelism = %s\n' "$BUILDX_MAX_PARALLELISM" > "$BUILDKIT_CONFIG"
        echo "BuildKit will run at most $BUILDX_MAX_PARALLELISM step(s) at a time on this host."
      fi
      if docker buildx rm --force "$BUILDX_BUILDER" >/dev/null 2>&1; then echo "Removed the stale Buildx builder $BUILDX_BUILDER."; fi
      docker buildx create --name "$BUILDX_BUILDER" --driver docker-container ${BUILDKIT_CONFIG:+--config "$BUILDKIT_CONFIG"} --bootstrap >/dev/null
      echo "Buildx builder $BUILDX_BUILDER created."
    fi
    echo ">>> docker compose project $PROJECT from $DEPLOY_DIR/$COMPOSE_FILE_NAME, release ${APP_VERSION:-unknown}"
    if ! docker compose -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans --wait; then
      docker compose -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" -f "$COMPOSE_FILE_NAME" ps -a >&2 || true
      docker compose -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" -f "$COMPOSE_FILE_NAME" logs --tail 50 >&2 || true
      echo "The services did not all start: the release is not marked as deployed." >&2
      exit 1
    fi
    docker compose -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" -f "$COMPOSE_FILE_NAME" ps
  # Hosts are formulas over the library entries, so a domain is written once (ADR-043). HOST_PREFIX is
  # usually empty in production; `:-` says empty is accepted.
  APP_HOST: "$(HOST_PREFIX:-)$(APP_SUBDOMAIN:suffix=.)$(DOMAIN)"
  API_HOST: "$(HOST_PREFIX:-)$(API_SUBDOMAIN).$(DOMAIN)"
  PUBLIC_APP_URL: "https://$(APP_HOST)"
  PUBLIC_API_URL: "https://$(API_HOST)"
  # The names the Compose file may read that the platform gives it, written once for the blue-green steps (the
  # replacement exports the same ones itself).
  FRONT_URL: "$(PUBLIC_APP_URL)"
  API_BASE_URL: "$(PUBLIC_API_URL)"
  API_URL: "$(PUBLIC_API_URL)"
  APP_VERSION: "$(APPLICATION_CANDIDATE_VERSION)"
  # Blue-green: the identity of the environment the native steps act on. The state directory and the four ports are
  # entries of the library `prod` (the wizard reserves the ports), the Apache files those of the upstream the cutover
  # maintains. The source the colours are built from is the sealed one, unpacked by the host preparation.
  BG_PROJECT: "$(COMPOSE_PROJECT)"
  BG_STATE_DIR: "$(STATE_DIR)"
  BG_ENV_FILE: "$(STATE_DIR)/deploy.env"
  BG_COMPOSE_FILES: "$(WORKSPACE)/.release-source/$(COMPOSE_FILE)"
  BG_PORTS: "$(PORT_FRONT_BLUE:-),$(PORT_BACK_BLUE:-),$(PORT_FRONT_GREEN:-),$(PORT_BACK_GREEN:-)"
  BG_UPSTREAM_TEMPLATE: "$(WORKSPACE)/.bluegreen-upstream.conf"
  BG_UPSTREAM_CONF: "$(UPSTREAM_CONF:-)"
  BG_RELOAD_HELPER: "$(APACHE_RELOAD_HELPER:-)"
  BG_PUBLIC_ORIGIN: "https://$(APP_HOST)"
  BG_PUBLIC_API_ORIGIN: "https://$(API_HOST)"
  BG_REVISION: "$(APPLICATION_CANDIDATE_VERSION)"
  BG_COMPOSE_ENV: "APP_VERSION,SOURCE_COMMIT,DOTNET_SDK_VERSION,FRONT_URL,API_BASE_URL,API_URL,PORT_FRONT_BLUE,PORT_BACK_BLUE,PORT_FRONT_GREEN,PORT_BACK_GREEN"

# Recette R3-67 and R2-21: the libraries and the vault a production deployment reads, named like the
# platform's own (`<project>.share`, `<project>.prod`): `${{ project.slug }}` is the project's slug, so the
# setup wizard creates them in the project under the name its runs read.
vaults:
  - "${{ project.slug }}.prod"
variable_libraries:
  - "${{ project.slug }}.share"
  - "${{ project.slug }}.prod"

stages:
  - name: Restore candidate
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    steps:
      - name: Restore immutable candidate payload
        type: restore-artifacts
        release: "$(APPLICATION_CANDIDATE_VERSION)"
        artifact: ApplicationPayload-artifacts
        timeout_seconds: 1800

  # The deployment gate: what reaches production is the exact payload the candidate qualified. The restore
  # already refuses a payload without its three seals or built from another commit; this stage also
  # requires the deploy branch to contain the release commit, because the instructions of this run come
  # from the branch while the bytes come from the release.
  - name: Verify candidate
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Restore candidate]
    steps:
      - name: Verify the deploy branch contains the release
        type: aetheus
        function: verify-release-ancestry
        with:
          source_commit_file: .pipeline-artifacts/source-commit
          deploy_ref: HEAD
        timeout_seconds: 300

  # Recette R-24: a release the Gate rejected, or graded F, may still reach production, but only after this extra
  # approval, asked before anything changes on the server (Apache, certificates, Compose, colours). The control
  # plane writes RELEASE_GATE_STATUS and RELEASE_GATE_GRADE from the release of the run's own project, and
  # RELEASE_GATE_APPROVAL, `not-required` only for an accepted release graded A to E. Any other value, and its
  # absence (a release that does not exist, a backend that does not write it), asks for the approval: it is never
  # skipped by default. A refusal or an expiry fails the run before the deployment starts.
  - name: Approve a rejected or F-graded release
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Verify candidate]
    condition: "ne(variables['RELEASE_GATE_APPROVAL'], 'not-required')"
    approval_timeout_minutes: 60
    steps:
      - name: Record the approval of the risky deployment
        shell: echo "Deployment of release $(APPLICATION_CANDIDATE_VERSION) approved (Gate verdict $(RELEASE_GATE_STATUS:-unknown), grade $(RELEASE_GATE_GRADE:-unknown))."
        timeout_seconds: 60

  # Blue-green only. Unpacks the sealed source the colours are built from, writes the environment file the native
  # steps read (erased by the last stage), and creates the Apache upstream (the Defines the virtual hosts read) on
  # the blue ports the first time. The upstream is live state the cutover owns: it is never overwritten.
  - name: Prepare host
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Approve a rejected or F-graded release]
    condition: "eq(variables['DEPLOY_STRATEGY'], 'bluegreen')"
    steps:
      - name: Unpack the release and render the environment file
        working_directory: "$(WORKSPACE)"
        env_template: "$(DEPLOY_ENV_SAMPLE)"
        shell: |
          set -eu
          fail() { echo "FATAL: $*" >&2; exit 1; }
          for name in STATE_DIR COMPOSE_PROJECT COMPOSE_FILE UPSTREAM_DEFINE UPSTREAM_CONF UPSTREAM_LINK \
            PORT_FRONT_BLUE PORT_BACK_BLUE PORT_FRONT_GREEN PORT_BACK_GREEN; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || fail "$name is empty: fill it in the library prod (the setup wizard creates it), a blue-green deployment cannot start without it."
          done
          case "$COMPOSE_FILE" in /*|*..*) fail "COMPOSE_FILE must be a path inside the repository: $COMPOSE_FILE" ;; esac
          case "$STATE_DIR" in /*) ;; *) fail "STATE_DIR must be an absolute path: $STATE_DIR" ;; esac
          case "$STATE_DIR" in *..*) fail "STATE_DIR must not contain a traversal: $STATE_DIR" ;; esac
          test -s .pipeline-artifacts/source.tar.gz || fail "The candidate payload holds no source archive (.pipeline-artifacts/source.tar.gz)."
          rm -rf .release-source
          mkdir .release-source
          # Readable by the non-root user of the containers the colours build: not the runner's restrictive umask.
          (umask 022 && tar -xzf .pipeline-artifacts/source.tar.gz -C .release-source)
          [ -f ".release-source/$COMPOSE_FILE" ] || fail "The Compose file $COMPOSE_FILE is not in the sealed source of the release."
          if ! test -d "$STATE_DIR"; then
            install -d -m 700 "$STATE_DIR" 2>/dev/null \
              || fail "The state directory $STATE_DIR cannot be created by this agent: create it once, owned by the agent's user (the blue-green journal lives there), or set STATE_DIR in the library prod to a directory it owns."
          fi
          test ! -L "$STATE_DIR" || fail "The state directory must not be a symbolic link: $STATE_DIR"
          # The environment file: rendered from the versioned sample, readable by its owner only, erased by the last
          # stage of the run.
          umask 077
          printf '%s' "$AETHEUS_ENV_FILE_B64" | base64 -d > "$STATE_DIR/deploy.env.tmp"
          mv "$STATE_DIR/deploy.env.tmp" "$STATE_DIR/deploy.env"
          # The upstream template the switch renders: only the Define name is resolved here.
          cat > .bluegreen-upstream.conf.in <<'UPSTREAM_TEMPLATE'
          # Managed by the deployment pipeline: the blue-green cutover of this project owns this live state; apache-config never overwrites it.
          Define #{UPSTREAM_DEFINE}#_FRONT_PORT #{FRONT_PORT}#
          Define #{UPSTREAM_DEFINE}#_BACK_PORT #{BACK_PORT}#
          # Active colour: #{ACTIVE_COLOR}#
          UPSTREAM_TEMPLATE
          sed -e "s/#{UPSTREAM_DEFINE}#/$UPSTREAM_DEFINE/g" .bluegreen-upstream.conf.in > .bluegreen-upstream.conf
          rm -f .bluegreen-upstream.conf.in
          case "$UPSTREAM_DEFINE" in [A-Z]*) ;; *) fail "UPSTREAM_DEFINE must start with an upper-case letter: $UPSTREAM_DEFINE" ;; esac
          case "$UPSTREAM_DEFINE" in *[!A-Z0-9_]*) fail "UPSTREAM_DEFINE must be upper case, digits and underscores: $UPSTREAM_DEFINE" ;; esac
          case "$UPSTREAM_CONF" in */sites-available/?*) ;; *) fail "UPSTREAM_CONF must be a file in a sites-available directory: $UPSTREAM_CONF" ;; esac
          case "$UPSTREAM_LINK" in */sites-enabled/?*) ;; *) fail "UPSTREAM_LINK must be a link in a sites-enabled directory: $UPSTREAM_LINK" ;; esac
          if [ ! -f "$UPSTREAM_CONF" ]; then
            LIVE_COLOR="$(cat "$STATE_DIR/live-color" 2>/dev/null || echo blue)"
            case "$LIVE_COLOR" in
              green) FRONT_PORT="$PORT_FRONT_GREEN"; BACK_PORT="$PORT_BACK_GREEN" ;;
              *) LIVE_COLOR=blue; FRONT_PORT="$PORT_FRONT_BLUE"; BACK_PORT="$PORT_BACK_BLUE" ;;
            esac
            echo ">>> Creating the Apache upstream on the $LIVE_COLOR ports"
            sed -e "s/#{FRONT_PORT}#/$FRONT_PORT/g" -e "s/#{BACK_PORT}#/$BACK_PORT/g" -e "s/#{ACTIVE_COLOR}#/$LIVE_COLOR/g" \
              .bluegreen-upstream.conf > "$UPSTREAM_CONF.tmp"
            mv "$UPSTREAM_CONF.tmp" "$UPSTREAM_CONF"
          fi
          test ! -L "$UPSTREAM_CONF" || fail "The upstream file must not be a symbolic link: $UPSTREAM_CONF"
          [ -L "$UPSTREAM_LINK" ] || ln -s "$UPSTREAM_CONF" "$UPSTREAM_LINK"
          SOURCE_SHA="$(cat .pipeline-artifacts/source-commit 2>/dev/null || true)"
          test -n "$SOURCE_SHA" || fail "The candidate payload holds no source commit (.pipeline-artifacts/source-commit)."
          SDK_VERSION="none"
          if [ -f .release-source/global.json ]; then
            SDK_VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .release-source/global.json | head -n 1)"
            SDK_VERSION="${SDK_VERSION:-none}"
          fi
          # R-28: the Up stage starts the idle colour with --no-build, so its images must already exist. Both colours
          # are built here from the sealed source, under the Compose project and with the inputs the native steps
          # use (BG_COMPOSE_ENV). Docker Compose reads COMPOSE_FILE itself: the subshell drops it so -f is the only file.
          echo ">>> Building the blue and green images from the sealed source"
          (
            export SOURCE_COMMIT="$SOURCE_SHA" DOTNET_SDK_VERSION="$SDK_VERSION" APP_VERSION FRONT_URL API_BASE_URL API_URL
            BG_FILE=".release-source/$COMPOSE_FILE"
            unset COMPOSE_FILE
            docker compose -p "$COMPOSE_PROJECT" --env-file "$STATE_DIR/deploy.env" -f "$BG_FILE" \
              --profile blue --profile green build
          ) || fail "The colour images could not be built from the sealed source of release $SOURCE_SHA."
          echo "##aetheus[setvariable name=SOURCE_COMMIT]$SOURCE_SHA"
          echo "##aetheus[setvariable name=DOTNET_SDK_VERSION]$SDK_VERSION"
          echo ">>> Host prepared for release $SOURCE_SHA."
        outputs: [SOURCE_COMMIT, DOTNET_SDK_VERSION]
        timeout_seconds: 3600

  # Apply the HTTP virtual hosts and the certificates before the HTTPS ones, so ACME validation can reach each host.
  # The virtual hosts are files of the project's configuration repository; the front's always, the API's when the
  # Compose file publishes a back port.
  - name: Apply HTTP vhosts
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Prepare host]
    steps:
      # The vhost steps come first (R-82): a missing template is refused at launch, before any stage runs; here it
      # also stops this stage before the ACME grant.
      - name: Apply the versioned HTTP vhost of the front
        type: apache-config
        condition: "ne(variables['DEPLOY_HAS_API'], 'true')"
        config_files:
          "$(APP_HOST).conf": ".pipeline/configs/apache/app-http.conf"
        timeout_seconds: 600
      - name: Apply the versioned HTTP vhosts of the front and the API
        type: apache-config
        condition: "eq(variables['DEPLOY_HAS_API'], 'true')"
        config_files:
          "$(APP_HOST).conf": ".pipeline/configs/apache/app-http.conf"
          "$(API_HOST).conf": ".pipeline/configs/apache/api-http.conf"
        timeout_seconds: 600
      # Only the certificate stage that follows needs the challenge directory to be reachable.
      - name: Let Apache read the ACME challenge directory
        type: aetheus
        function: grant-acme-challenge-traversal
        with:
          webroot: "$(ACME_WEBROOT)"
        timeout_seconds: 120

  - name: TLS
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Apply HTTP vhosts]
    steps:
      - name: Issue, renew and check the certificate of the front
        type: aetheus
        function: ensure-tls-certificates
        condition: "ne(variables['DEPLOY_HAS_API'], 'true')"
        with:
          hosts: "$(APP_HOST)"
          email: "$(CERTBOT_EMAIL:-)"
        timeout_seconds: 900
      - name: Issue, renew and check the certificates of the front and the API
        type: aetheus
        function: ensure-tls-certificates
        condition: "eq(variables['DEPLOY_HAS_API'], 'true')"
        with:
          hosts: "$(APP_HOST) $(API_HOST)"
          email: "$(CERTBOT_EMAIL:-)"
        timeout_seconds: 900

  - name: Apply Apache vhosts
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [TLS]
    steps:
      - name: Apply the versioned HTTPS vhost of the front
        type: apache-config
        condition: "ne(variables['DEPLOY_HAS_API'], 'true')"
        config_files:
          "$(APP_HOST)-ssl.conf": ".pipeline/configs/apache/app-https.conf"
        timeout_seconds: 600
      - name: Apply the versioned HTTPS vhosts of the front and the API
        type: apache-config
        condition: "eq(variables['DEPLOY_HAS_API'], 'true')"
        config_files:
          "$(APP_HOST)-ssl.conf": ".pipeline/configs/apache/app-https.conf"
          "$(API_HOST)-ssl.conf": ".pipeline/configs/apache/api-https.conf"
        timeout_seconds: 600

  # The replacement of the running services (the default strategy): the sealed source is started with Docker
  # Compose and the environment file rendered below, which is erased when the step ends.
  - name: Deploy
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Apply Apache vhosts]
    condition: "ne(variables['DEPLOY_STRATEGY'], 'bluegreen')"
    steps:
      - name: Run project production deployment commands
        working_directory: "$(WORKSPACE)"
        env_template: "$(DEPLOY_ENV_SAMPLE)"
        shell: |
          set -eu
          if test -z "${APPLICATION_DEPLOY_PROD_COMMANDS:-}"; then
            echo "No production deployment command declared: set APPLICATION_DEPLOY_PROD_COMMANDS in this pipeline." >&2
            exit 1
          fi
          if test -z "$(DOMAIN)"; then
            echo "WARNING: DOMAIN is empty in the prod library; APP_HOST and API_HOST are incomplete." >&2
          fi
          # The environment file: rendered from the versioned sample, readable by its owner only, and erased
          # whatever the outcome. Naming the vault keys here is what lets the step receive them (a secret reaches
          # only the steps whose text mentions it).
          export DB_PASSWORD JWT_KEY ENCRYPTION_KEY ENCRYPTION_SALT
          umask 077
          DEPLOY_ENV_FILE="$(mktemp "$(WORKSPACE)/.deploy-env.XXXXXX")"
          export DEPLOY_ENV_FILE
          trap 'rm -f "$DEPLOY_ENV_FILE"' EXIT
          printf '%s' "$AETHEUS_ENV_FILE_B64" | base64 -d > "$DEPLOY_ENV_FILE"
          APPLICATION_CANDIDATE_VERSION="$(APPLICATION_CANDIDATE_VERSION)" \
          APPLICATION_ROLLBACK_ENABLED="$(APPLICATION_ROLLBACK_ENABLED)" \
            sh -eu -c "$APPLICATION_DEPLOY_PROD_COMMANDS"
        timeout_seconds: 7200

  # The blue-green cutover (DEPLOY_STRATEGY=bluegreen), with the platform's native steps: the idle colour is started
  # and health-gated on its own ports, the Apache upstream is moved to it, the deployed application is probed, then
  # the previous colour is kept in reserve. The migration of a database is the project's own business: its
  # Compose file runs it.
  - name: Up
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Deploy]
    condition: "eq(variables['DEPLOY_STRATEGY'], 'bluegreen')"
    steps:
      - name: Start and health-gate the idle colour
        type: bluegreen-up
        # The colour serving before this deployment, `none` for the project's first one: the Rollback stage
        # reads it to retire a failed first deployment instead of rolling it back to nothing.
        outputs: [BLUEGREEN_LIVE_COLOR]
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        compose_env: "$(BG_COMPOSE_ENV)"
        # A transaction an earlier, ended run left open is undone before the colour is rebuilt, which puts the
        # recorded upstream back: the step needs the same targets as the rollback.
        upstream_conf: "$(BG_UPSTREAM_CONF)"
        reload_helper: "$(BG_RELOAD_HELPER)"
        timeout_seconds: 3600

  - name: Switch
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Up]
    condition: "eq(variables['DEPLOY_STRATEGY'], 'bluegreen')"
    steps:
      - name: Point traffic at the idle colour
        type: bluegreen-switch
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        compose_env: "$(BG_COMPOSE_ENV)"
        upstream_template: "$(BG_UPSTREAM_TEMPLATE)"
        upstream_conf: "$(BG_UPSTREAM_CONF)"
        reload_helper: "$(BG_RELOAD_HELPER)"
        revision: "$(BG_REVISION)"
        timeout_seconds: 600

  - name: Evidence
    group: Smoke
    execution_role: deploy
    os: linux
    depends_on: [Switch]
    condition: "eq(variables['DEPLOY_STRATEGY'], 'bluegreen')"
    steps:
      # A deployment that does not answer fails this stage, which hands control to the rollback.
      - name: Probe the deployed application
        type: smoke
        origin: "$(BG_PUBLIC_ORIGIN)"
        api_origin: "$(BG_PUBLIC_API_ORIGIN)"
        samples: "3"
        max_seconds: "5"
        evidence_gate: blocking
        timeout_seconds: 1800

  - name: Record release
    group: Release
    execution_role: deploy
    os: linux
    depends_on: [Evidence]
    steps:
      - name: Mark the exact candidate release as deployed
        type: release
        version: "$(APPLICATION_CANDIDATE_VERSION)"
        deployed: true
        timeout_seconds: 300

  - name: Commit
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Record release]
    condition: "eq(variables['DEPLOY_STRATEGY'], 'bluegreen')"
    steps:
      - name: Close the deployment transaction
        type: bluegreen-commit
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        compose_env: "$(BG_COMPOSE_ENV)"
        timeout_seconds: 600

  - name: Rollback
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    condition: "failed()"
    depends_on: [Commit]
    # Exactly one of the two steps runs. A deployment that replaced a live colour is rolled back to it. The
    # project's first deployment (Up published BLUEGREEN_LIVE_COLOR=none) has no colour to return to: the
    # rollback refuses it, so it is retired, which puts back the recorded upstream, stops the colour and closes
    # the transaction; left open, it would refuse every later deployment. Up never ran, or failed: the variable is
    # absent and the rollback says there is nothing to undo.
    steps:
      - name: Restore the previous colour
        type: bluegreen-rollback
        condition: "ne(variables['BLUEGREEN_LIVE_COLOR'], 'none')"
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        compose_env: "$(BG_COMPOSE_ENV)"
        upstream_conf: "$(BG_UPSTREAM_CONF)"
        reload_helper: "$(BG_RELOAD_HELPER)"
        timeout_seconds: 1800
      - name: Retire the failed first deployment
        type: bluegreen-retire
        condition: "eq(variables['BLUEGREEN_LIVE_COLOR'], 'none')"
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        compose_env: "$(BG_COMPOSE_ENV)"
        upstream_conf: "$(BG_UPSTREAM_CONF)"
        reload_helper: "$(BG_RELOAD_HELPER)"
        timeout_seconds: 1800

  # Blue-green only: the environment file written for the native steps is erased, the run's outcome notwithstanding.
  - name: Erase environment file
    group: Deploy
    execution_role: deploy
    agent: "${{ parameters.deployServer }}"
    os: linux
    depends_on: [Rollback]
    condition: "always()"
    steps:
      - name: Erase the rendered environment file and the unpacked source
        condition: "eq(variables['DEPLOY_STRATEGY'], 'bluegreen')"
        working_directory: "$(WORKSPACE)"
        shell: |
          set -eu
          rm -f "$(STATE_DIR)/deploy.env" "$(STATE_DIR)/deploy.env.tmp"
          rm -rf .release-source
          echo ">>> The environment file is erased."
        timeout_seconds: 300

  # R-77: once the release is deployed and the environment file erased, `main` follows production, as in the platform's
  # own production pipeline (ADR-044): the backend moves the branch onto the commit the deployed candidate was built from
  # and tags it with the release version, without any credential on the agent. Last stage and only after a run that has
  # not failed (`succeeded()`), so it never runs after a failed deployment and nothing it does can undo the serving
  # release (the rollback stage is in front of it and already past). A skipped dependency (Evidence, Commit and Rollback are skipped for the
  # `replace` strategy) does not hold it back. The step refuses, and says so on the run, a project with no internal
  # repository holding the commit (an external repository), a strictly protected branch and a tag already on another
  # commit; that refusal FAILS the run (owner decision 2026-10-28), so a `main` that did not follow production is
  # never silent. The step reads the release from AETHEUS_CANDIDATE_VERSION.
  - name: Advance main
    group: Release
    execution_role: deploy
    os: linux
    depends_on: [Erase environment file]
    condition: "succeeded()"
    steps:
      - name: Advance main onto the deployed candidate commit
        type: advance-branch
        branch: main
        # Tag the deployed commit with its version so the served release remains identifiable.
        tag: "v$(APPLICATION_CANDIDATE_VERSION)"
        timeout_seconds: 60
