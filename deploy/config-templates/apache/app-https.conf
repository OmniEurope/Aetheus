# HTTPS virtual host of the application's front, applied by the production deployment of the project once its
# certificate exists. It proxies to the loopback port the Compose file publishes (PORT_FRONT).
# This file is the project's: Aetheus created it from its generic template and never overwrites it, so edit it freely.
# The names written between a hash-and-brace pair (here the host and the port) are replaced at each deployment by the
# entry of the same name in the project's variable libraries; a name with no entry stops the deployment.
<VirtualHost *:443>
    ServerName #{APP_HOST}#
    SSLEngine On
    # One certificate per host, so a failed issuance for one name cannot take down another virtual host.
    SSLCertificateFile /etc/letsencrypt/live/#{APP_HOST}#/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/#{APP_HOST}#/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    ProxyPass / http://127.0.0.1:#{PORT_FRONT}#/
    ProxyPassReverse / http://127.0.0.1:#{PORT_FRONT}#/
    ErrorLog ${APACHE_LOG_DIR}/#{APP_HOST}#_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/#{APP_HOST}#_ssl_access.log combined
</VirtualHost>
