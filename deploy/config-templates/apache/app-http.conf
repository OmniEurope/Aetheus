# Port 80 virtual host of the application's front, applied by the production deployment of the project.
# This file is the project's: Aetheus created it from its generic template and never overwrites it, so edit it freely.
# The names written between a hash-and-brace pair (here the host) are replaced at each deployment by the entry of the
# same name in the project's variable libraries; a name with no entry stops the deployment.
<VirtualHost *:80>
    ServerName #{APP_HOST}#
    # Exclude the ACME challenges from the HTTPS redirect, so a certificate can be issued before HTTPS works.
    RewriteEngine On
    # A condition, never a rule matching the path: a rule short-circuits mod_alias.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/#{APP_HOST}#_error.log
    CustomLog ${APACHE_LOG_DIR}/#{APP_HOST}#_access.log combined
</VirtualHost>
