name: ci-vps-to-vps
trigger: manual
variable_libraries:
  - deploy-config
vaults:
  - ci-secrets
stages:
  # ── Build (VPS) ──
  - name: Compile
    group: Build
    os: linux
    steps:
      - name: Restore & Build
        shell: dotnet build $(WORKSPACE)/Aetheus.slnx --configuration Release --nologo -v q
        working_directory: $(WORKSPACE)
        timeout_seconds: 300

  - name: Tests
    group: Build
    os: linux
    depends_on:
      - Compile
    steps:
      - name: Run Back Tests
        shell: dotnet test --project $(WORKSPACE)/tests/Aetheus.Back.Tests --no-build -c Release --output Detailed
        timeout_seconds: 300
      - name: Run Front Tests
        shell: dotnet test --project $(WORKSPACE)/tests/Aetheus.Front.Tests --no-build -c Release --output Detailed
        timeout_seconds: 300
      - name: Run Agent Tests
        shell: dotnet test --project $(WORKSPACE)/tests/Aetheus.Agent.Core.Tests --no-build -c Release --output Detailed
        timeout_seconds: 300

  - name: Coverage
    group: Build
    os: linux
    depends_on:
      - Tests
    steps:
      - name: Collect Coverage
        shell: >-
          dotnet test --project $(WORKSPACE)/tests/Aetheus.Back.Tests --no-build -c Release --coverlet --results-directory $(WORKSPACE)/coverage &&
          dotnet test --project $(WORKSPACE)/tests/Aetheus.Front.Tests --no-build -c Release --coverlet --results-directory $(WORKSPACE)/coverage &&
          dotnet test --project $(WORKSPACE)/tests/Aetheus.Agent.Core.Tests --no-build -c Release --coverlet --results-directory $(WORKSPACE)/coverage &&
          sh $(WORKSPACE)/deploy/scripts/normalize-coverage-report.sh $(WORKSPACE)/coverage
        timeout_seconds: 300

  # The coverage report reads the files Collect Coverage writes: steps of one stage run concurrently (ADR-012).
  - name: CoverageReport
    group: Build
    os: linux
    depends_on: [Coverage]
    steps:
      - name: Publish Coverage
        type: coverage
        continue_on_error: true

  - name: Lint
    group: Build
    os: linux
    depends_on:
      - Compile
    steps:
      - name: Check Formatting
        shell: dotnet format $(WORKSPACE)/Aetheus.slnx --verify-no-changes --no-restore -v diag
        timeout_seconds: 120
        continue_on_error: true

  - name: QualityGate
    group: Quality
    os: linux
    depends_on:
      - CoverageReport
      - Lint
    steps:
      - name: Publish the advisory coverage grade
        type: analysis-gate
        analysis_scope: quality
        analysis_grading:
          version: 1
          minimum_grade: F
          required_domains:
            - reliability
          rules:
            - key: grade.coverage.line
              domain: reliability
              metric: coverage.line.percent
              category: coverage
              direction: higher-is-better
              a: 75
              b: 65
              c: 55
              d: 40
              e: 20
        continue_on_error: true
        timeout_seconds: 300

  - name: Publish
    group: Build
    os: linux
    depends_on:
      - QualityGate
    artifacts:
      - $(WORKSPACE)/publish/back
    steps:
      - name: Publish Back
        shell: dotnet publish $(WORKSPACE)/src/Aetheus.Back -c Release -o $(WORKSPACE)/publish/back --nologo -v q
        timeout_seconds: 120

  - name: Release
    group: Build
    os: linux
    depends_on:
      - Publish
    steps:
      - name: Create Release
        type: release
        version: "1.0.$(BUILD_BUILDID)"
        changelog: true

  # ── Deploy (VPS) ──
  - name: Substitute
    group: Deploy
    os: linux
    depends_on:
      - Release
    steps:
      - name: Variable Substitution
        type: substitute
        target_files:
          - $(WORKSPACE)/publish/back/appsettings.json

  # Steps of one stage run concurrently (ADR-012): stop, copy and start are three stages, each waiting
  # for the previous one, so the service never starts on a partial copy (audit DEP-008).
  - name: Stop
    group: Deploy
    os: linux
    depends_on:
      - Substitute
    steps:
      - name: Stop Service
        shell: sudo systemctl stop aetheus-back || true
        timeout_seconds: 30

  - name: Copy
    group: Deploy
    os: linux
    depends_on:
      - Stop
    steps:
      - name: Copy Files
        shell: cp -r $(WORKSPACE)/publish/back/* $(TARGET_DIR)/
        timeout_seconds: 120

  - name: Start
    group: Deploy
    os: linux
    depends_on:
      - Copy
    steps:
      - name: Start Service
        shell: sudo systemctl start aetheus-back
        timeout_seconds: 30
