<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:10025/
    ProxyPassReverse / http://127.0.0.1:10025/
    ServerName aetheus.example.com
RewriteEngine on
RewriteCond %{SERVER_NAME} =aetheus.example.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:10026/
    ProxyPassReverse / http://127.0.0.1:10026/
    ServerName aetheus-api.example.com
RewriteEngine on
RewriteCond %{SERVER_NAME} =aetheus-api.example.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:10025/
    ProxyPassReverse / http://127.0.0.1:10025/
    ServerName aetheus.example.com

    # Perf: HTTP/2 multiplexes the many small _framework/*.{dll,wasm} requests of
    # the Blazor WASM boot over a single connection (large first-load win). Safe
    # no-op if mod_http2 is not loaded. No mod_deflate here: the StaticServer
    # already Brotli-compresses. No immutable Cache-Control: framework assets are
    # NOT fingerprinted (StaticWebAssetsPublishFingerprint=false), so caching
    # them long would serve stale WASM after a deploy; the in-app version-check
    # loop already detects new builds.
    Protocols h2 http/1.1

    <LocationMatch "^/(index\.html|service-worker(\.published)?\.js|_framework/|_content/OmniEurope\.Blazor/)">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </LocationMatch>

    # F-21: security headers for the Blazor WASM frontend.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # Blazor WASM requires 'wasm-unsafe-eval' and blob: for the WebAssembly module loader.
    # connect-src must include the API host and its wss endpoint (SignalR).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: 'report-sample'; style-src 'self'; style-src-elem 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://aetheus-api.example.com wss://aetheus-api.example.com; frame-ancestors 'none'"


SSLCertificateFile /etc/letsencrypt/live/aetheus.example.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/aetheus.example.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ProxyPreserveHost On
    ServerName aetheus-api.example.com

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # The API sends HSTS itself, but not on the pages Apache answers alone (a 502 during a restart).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # A scoped npm package is addressed as @scope%2fname, and Apache answers 404 to any encoded
    # slash under the default AllowEncodedSlashes Off - publishing @aetheus/web-analytics was
    # impossible. NoDecode passes %2f through untouched so ASP.NET routing still sees one segment
    # (decoding it here would split the path and break the route instead).
    AllowEncodedSlashes NoDecode

    # Scrub access_token from logged URLs (SignalR JWT)                                                                                                                                                                                                                                                                                                                 
    # Request_URI is the path alone: the token travels in the query string, which SetEnvIf never
    # saw, so the full request line with the JWT reached the log (audit DEP-011).
    SetEnvIfExpr "%{QUERY_STRING} =~ /(^|&)access_token=/" sanitized_uri
    CustomLog ${APACHE_LOG_DIR}/aetheus-api-access.log combined env=!sanitized_uri
    CustomLog ${APACHE_LOG_DIR}/aetheus-api-access.log "sanitized: %h %l %u %t \"%m %U %H\" %>s %b" env=sanitized_uri

    RewriteEngine On

    # WebSocket (SignalR hubs)                                                                                                                                                                                                                                                                                                                                          
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:10026/$1 [P,L]

    # HTTP normal (including OPTIONS preflight: backend handles CORS)                                                                                                                                                                                                                                                                                                  
    # nocanon keeps the encoded slash allowed by NoDecode above from being recanonicalized.
    ProxyPass / http://127.0.0.1:10026/ nocanon
    ProxyPassReverse / http://127.0.0.1:10026/

SSLCertificateFile /etc/letsencrypt/live/aetheus.example.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/aetheus.example.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
