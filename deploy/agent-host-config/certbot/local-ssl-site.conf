# Managed by Aetheus - local self-signed HTTPS for $primary
<VirtualHost *:443>
    ServerName $primary
    SSLEngine on
    SSLCertificateFile $dir/fullchain.pem
    SSLCertificateKeyFile $dir/privkey.pem
    # Browsers ignore this header on a certificate they do not trust (RFC 6797, 8.1), so a self-signed
    # certificate stays reachable; Apache's own error pages carry it too.
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyPreserveHost On
    ProxyRequests Off
    $proxy_line
    $proxy_rev
</VirtualHost>
