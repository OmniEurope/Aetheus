# Serves the ACME challenge from the web root on every virtual host of this server, the ones Aetheus does
# not own included. A vhost that proxies everything to its application, directly or after a redirect to
# HTTPS (Lets Encrypt follows it), would otherwise hand the challenge to the application: a proxy rule is
# checked before the Alias. ProxyPass with an exclusion is inherited by every vhost and covers ProxyPass
# and ProxyPassMatch; the no-proxy variable covers ProxyPass inside a Location section. A RewriteRule
# with the P flag in a vhost is not covered (rewrite rules of the main server are not inherited).
Alias /.well-known/acme-challenge/ $ACME_WEBROOT/.well-known/acme-challenge/
<Directory "$ACME_WEBROOT/.well-known/acme-challenge">
    Require all granted
</Directory>
<IfModule mod_proxy.c>
    ProxyPass /.well-known/acme-challenge/ !
</IfModule>
<IfModule mod_setenvif.c>
    SetEnvIf Request_URI "^/\.well-known/acme-challenge/" no-proxy
</IfModule>
