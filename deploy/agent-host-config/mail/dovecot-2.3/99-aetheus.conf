# Managed by Aetheus mail-setup. Overwritten by the next setup run.
protocols = imap pop3 lmtp
mail_location = maildir:/var/mail/vhosts/%d/%n
disable_plaintext_auth = yes
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/users
}
# The users file is also the userdb (DEP-005): each line may carry the mailbox quota Aetheus stores as
# userdb_quota_rule; the mail location fields are fixed here.
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  override_fields = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}
# Quota plugin (DEP-005): a line without a quota field is unlimited. No grace: the limit Aetheus shows
# is the limit an IMAP APPEND or an LMTP delivery meets (552 5.2.2, a permanent refusal).
mail_plugins = $mail_plugins quota
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_grace = 0
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
