# Managed by Aetheus mail-manage master-set (recette R1-41). Overwritten by the next master-set run.
# Aetheus opens a mailbox as "<address>*aetheus-master" with the master password it keeps encrypted.
auth_master_user_separator = *
passdb aetheus-master {
  driver = passwd-file
  master = yes
  passwd_file_path = /etc/dovecot/master-users
  # No default scheme: doveadm pw writes every hash with its {SHA512-CRYPT} prefix.
  # The target mailbox must exist in the regular passdb.
  result_success = continue
}
