# Managed by Aetheus mail-setup. Overwritten by the next setup run.
protocols = imap pop3 lmtp
mail_driver = maildir
mail_home = /var/mail/vhosts/%{user | domain}/%{user | username}
mail_path = ~
mail_inbox_path =
auth_allow_cleartext = no
auth_mechanisms = plain login
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  # No default scheme: doveadm pw writes every hash with its {SHA512-CRYPT} prefix.
}
# Virtual users are full addresses: Debian 13 ships an LMTP override that strips the domain.
protocol lmtp {
  auth_username_format = %{user | lower}
}
# The users file is also the userdb (DEP-005): each line may carry the mailbox quota Aetheus stores as
# userdb_quota_storage_size; the mail location fields are fixed here.
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  fields {
    uid = vmail
    gid = vmail
    home = /var/mail/vhosts/%{user | domain}/%{user | username}
  }
}
# Quota plugin (DEP-005): a line without a quota field is unlimited. No grace: the limit Aetheus shows
# is the limit an IMAP APPEND or an LMTP delivery meets (552 5.2.2, a permanent refusal).
mail_plugins {
  quota = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
quota "User quota" {
  quota_storage_grace = 0
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
